<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
 <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; connect-src 'self' https://api.radiogram.su https://radiogram.su https://radiogram-backend-production.up.railway.app; img-src 'self' https: data:; media-src 'self' blob: https://radiogram.su; object-src 'none'; frame-src 'self' https://www.youtube.com;">
  <title>Radio Gram</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    
    /* Аквариумные рыбки */
    .fish {
      position: fixed;
      width: 40px;
      height: 25px;
      pointer-events: auto;
      cursor: pointer;
      z-index: 999;
      transition: transform 0.3s ease;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
    }
    .fish svg {
      width: 100%;
      height: 100%;
    }
    .fish.swimming-left {
      transform: scaleX(-1);
    }
    .fish:hover {
      filter: drop-shadow(0 4px 8px rgba(100, 200, 255, 0.5));
    }
    
    .emoji {
      position: fixed;
      font-size: 24px;
      pointer-events: none;
      opacity: 0;
      z-index: 1000;
      animation: floatEmoji 4s ease-in-out;
      will-change: transform, opacity;
    }
    @keyframes floatEmoji {
      0% { opacity: 0; transform: translateY(20px) scale(0.5); }
      20% { opacity: 1; transform: translateY(0) scale(1); }
      80% { opacity: 1; transform: translateY(-10px) scale(1); }
      100% { opacity: 0; transform: translateY(-30px) scale(0.8); }
    }
    
    .player-wrapper { text-align: center; margin-bottom: 40px; position: relative; z-index: 10; }
    
    .play-button {
      width: 120px; height: 120px; border-radius: 50%;
      background: radial-gradient(circle at 30% 20%, #4a4a4f, #1a1a1e 80%);
      border: none;
      cursor: pointer;
      margin: 0 auto 25px; transition: all 0.3s ease;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.1);
      position: relative;
      z-index: 2;
      will-change: transform;
    }
    .play-button:hover { 
      transform: scale(1.03);
      background: radial-gradient(circle at 30% 20%, #55555a, #222226 80%);
    }
    .play-button:active { transform: scale(0.98); }
    .play-button:focus-visible {
      outline: 3px solid #ff3b30;
      outline-offset: 4px;
    }
    
    .play-button.paused {
      box-shadow: 0 0 25px rgba(255, 59, 48, 0.5), 0 8px 25px rgba(0, 0, 0, 0.6);
    }
    
    /* Эквалайзер вокруг кнопки Play */
    .equalizer-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 160px;
      height: 160px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
      display: none;
    }
    .equalizer-container.active {
      display: block;
    }
    .eq-bar {
      position: absolute;
      width: 6px;
      background: linear-gradient(180deg, #34d399, #059669, #34d399);
      border-radius: 3px;
      bottom: 50%;
      transform-origin: center bottom;
      box-shadow: 0 0 10px rgba(52, 211, 153, 0.6);
      transition: height 0.1s ease;
    }
    @keyframes equalizerFloat {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }
    .play-button.playing {
      box-shadow: 0 0 35px rgba(52, 211, 153, 0.6), 0 8px 25px rgba(0, 0, 0, 0.6);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 30px rgba(52, 211, 153, 0.5), 0 8px 25px rgba(0, 0, 0, 0.6); }
      50% { box-shadow: 0 0 50px rgba(52, 211, 153, 0.8), 0 8px 25px rgba(0, 0, 0, 0.6); }
    }
    
    .gram-icon {
      width: 55px; height: 55px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 7;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
      transition: all 0.3s;
    }

    .pause-icon {
      width: 50px; height: 50px;
      fill: #ffffff;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
      transition: all 0.3s;
    }
    
    .main-title { font-size: 36px; font-weight: 700; letter-spacing: 4px; margin-bottom: 8px; }
    .sub-title { font-size: 11px; color: #666; letter-spacing: 3px; margin-bottom: 20px; }
    .status { color: #ff3b30; font-size: 12px; margin-bottom: 10px; min-height: 18px; }
    .status.error { color: #ef4444; }
    .status.success { color: #4ade80; }
    .status.buffering { color: #fbbf24; }
    .listeners-count { 
      color: #4ade80; 
      font-size: 12px; 
      margin-bottom: 25px;
      font-weight: bold;
      text-shadow: 0 0 10px rgba(74, 222, 128, 0.5);
      transition: color 0.3s ease;
    }
    .listeners-count.active {
      color: #00ff88;
      text-shadow: 0 0 15px rgba(0, 255, 136, 0.7);
    }
    .listeners-count.offline {
      color: #ff6600;
      text-shadow: 0 0 10px rgba(255, 102, 0, 0.5);
    }
    
    .social-icons { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }
    .social-icons a {
      padding: 10px 20px; border-radius: 25px;
      background: #1a1a1a; color: #fff; text-decoration: none;
      transition: all 0.3s; font-size: 14px; border: 2px solid #333;
    }
    .social-icons a:hover { 
      background: #ff3b30; 
      border-color: #ff3b30;
      transform: translateY(-3px); 
    }
    .social-icons a:focus-visible {
      outline: 2px solid #ff3b30;
      outline-offset: 2px;
    }
    .social-icons a.youtube:hover { background: #ff0000; border-color: #ff0000; }
    .social-icons a.telegram:hover { background: #0088cc; border-color: #0088cc; }
    
    .donate-button {
      display: inline-block;
      margin-top: 25px;
      padding: 14px 32px;
      border-radius: 30px;
      background: linear-gradient(135deg, #667eea, #764ba2, #f093fb, #667eea);
      background-size: 300% 300%;
      color: #fff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 1px;
      border: none;
      cursor: pointer;
      transition: all 0.4s ease;
      box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);
      animation: gradientPulse 4s ease infinite, gentlePulse 2s ease-in-out infinite;
      position: relative;
      overflow: hidden;
    }
    .donate-button:hover {
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 8px 30px rgba(102, 126, 234, 0.6);
    }
    .donate-button:active {
      transform: translateY(-1px) scale(1.02);
    }
    .donate-button:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 3px;
    }
    @keyframes gradientPulse {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes gentlePulse {
      0%, 100% { 
        box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);
        transform: scale(1);
      }
      50% { 
        box-shadow: 0 6px 25px rgba(118, 75, 162, 0.5);
        transform: scale(1.03);
      }
    }
    
    .sleep-timer-container {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .sleep-timer-btn {
      padding: 12px 24px;
      border-radius: 25px;
      background: linear-gradient(135deg, #1e3a5f, #2d5a87);
      color: #fff;
      border: 2px solid #3a7ca5;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(30, 58, 95, 0.4);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sleep-timer-btn:hover {
      background: linear-gradient(135deg, #2d5a87, #3a7ca5);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(58, 124, 165, 0.5);
    }
    .sleep-timer-btn.active {
      background: linear-gradient(135deg, #3a7ca5, #4a9bc9);
      box-shadow: 0 0 20px rgba(58, 124, 165, 0.7);
      animation: timerPulse 2s ease-in-out infinite;
    }
    @keyframes timerPulse {
      0%, 100% { box-shadow: 0 0 15px rgba(58, 124, 165, 0.5); }
      50% { box-shadow: 0 0 25px rgba(58, 124, 165, 0.8); }
    }
    .sleep-timer-options {
      display: none;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 10px;
    }
    .sleep-timer-options.show {
      display: flex;
    }
    .sleep-time-option {
      padding: 10px 20px;
      border-radius: 20px;
      background: #1a1a1e;
      color: #fff;
      border: 2px solid #333;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .sleep-time-option:hover {
      background: #2d5a87;
      border-color: #3a7ca5;
      transform: scale(1.05);
    }
    .sleep-time-option.selected {
      background: #3a7ca5;
      border-color: #4a9bc9;
      box-shadow: 0 0 15px rgba(58, 124, 165, 0.6);
    }
    .sleep-timer-display {
      font-size: 12px;
      color: #4a9bc9;
      min-height: 18px;
      font-weight: 600;
      text-shadow: 0 0 10px rgba(74, 155, 201, 0.5);
    }
    
    .chat-container {
      width: 100%; max-width: 450px; background: #0a0a0a;
      border: 1px solid #222; border-radius: 12px; overflow: hidden;
      position: relative; z-index: 10;
    }
    .chat-header {
      background: #111; padding: 12px; text-align: center;
      font-size: 13px; font-weight: 600; letter-spacing: 1.5px;
      border-bottom: 1px solid #222;
    }
    .chat-messages {
      height: 280px; overflow-y: auto; padding: 12px;
      display: flex; flex-direction: column; gap: 8px;
      scroll-behavior: smooth;
    }
    .chat-messages::-webkit-scrollbar { width: 5px; }
    .chat-messages::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
    .chat-messages[aria-live="polite"] { }
    .chat-message {
      background: #151515; padding: 10px; border-radius: 8px;
      border-left: 3px solid #ff3b30; animation: slideIn 0.3s ease;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-10px); }
      to { opacity: 1; transform: translateX(0); }
    }
    .message-nick { font-size: 12px; color: #ff3b30; font-weight: 600; margin-bottom: 4px; }
    .message-text { font-size: 13px; line-height: 1.4; word-wrap: break-word; }
    .message-time { font-size: 10px; color: #555; margin-top: 4px; text-align: right; }
    .chat-input-wrapper {
      padding: 12px; background: #111; display: flex;
      gap: 8px; border-top: 1px solid #222;
    }
    .chat-input-wrapper input {
      flex: 1; padding: 10px 15px; border-radius: 20px;
      border: 1px solid #333; background: #0a0a0a;
      color: #fff; font-size: 13px; outline: none;
    }
    .chat-input-wrapper input:focus { border-color: #ff3b30; }
    .chat-input-wrapper input:focus-visible {
      outline: 2px solid #ff3b30;
      outline-offset: 2px;
    }
    .chat-input-wrapper button {
      width: 44px; height: 40px; border-radius: 50%;
      border: none; background: #ff3b30; color: #fff;
      cursor: pointer; font-size: 16px; transition: all 0.3s;
    }
    .chat-input-wrapper button:hover { background: #ff5750; transform: scale(1.1); }
    .chat-input-wrapper button:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 2px;
    }
    
    .nick-modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.95); display: flex;
      justify-content: center; align-items: center; z-index: 1000;
    }
    .nick-modal.hidden { display: none; }
    .modal-box {
      background: #1a1a1a; padding: 30px; border-radius: 12px;
      border: 1px solid #333; text-align: center;
      max-width: 90%; width: 320px;
    }
    .modal-box h3 { margin-bottom: 10px; font-size: 20px; }
    .modal-box p { color: #666; font-size: 13px; margin-bottom: 20px; }
    .modal-box input {
      width: 100%; padding: 12px; border-radius: 8px;
      border: 1px solid #333; background: #0a0a0a;
      color: #fff; margin-bottom: 15px; font-size: 14px;
    }
    .modal-box input:focus-visible {
      outline: 2px solid #ff3b30;
      outline-offset: 2px;
    }
    .modal-box button {
      width: 100%; padding: 12px; border-radius: 8px;
      border: none; background: #ff3b30; color: #fff;
      font-weight: 600; cursor: pointer; font-size: 14px;
    }
    .modal-box button:hover { background: #ff5750; }
    .modal-box button:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 2px;
    }
    .error-message {
      color: #ef4444;
      font-size: 12px;
      margin-top: 8px;
      display: none;
    }
    .error-message.visible {
      display: block;
    }
    @media (max-width: 600px) {
      body { padding: 15px; }
      .main-title { font-size: 28px; }
      .play-button { width: 100px; height: 100px; }
      .gram-icon { width: 45px; height: 45px; }
      .pause-icon { width: 40px; height: 40px; }
      .chat-messages { height: 240px; }
      .social-icons a { padding: 8px 16px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <div class="player-wrapper">
    <div class="equalizer-container" id="equalizerContainer">
      <div class="eq-bar" id="eqBar1"></div>
      <div class="eq-bar" id="eqBar2"></div>
      <div class="eq-bar" id="eqBar3"></div>
      <div class="eq-bar" id="eqBar4"></div>
      <div class="eq-bar" id="eqBar5"></div>
      <div class="eq-bar" id="eqBar6"></div>
      <div class="eq-bar" id="eqBar7"></div>
      <div class="eq-bar" id="eqBar8"></div>
    </div>
    <button class="play-button paused" id="playBtn" aria-label="Play/Pause" aria-pressed="false" role="button" tabindex="0">
      <svg class="gram-icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M 14 22 L 32 52 L 50 22" />
        <path d="M 14 22 L 50 22" />
        <path d="M 32 22 L 32 37" />
      </svg>
    </button>
    <div class="main-title">GRAM</div>
    <div class="sub-title">RADIO STREAM</div>
    <div class="status" id="statusText" role="status" aria-live="polite">Нажми для старта</div>
    <div class="listeners-count">🔊 Слушателей: <span id="listenerCount">0</span></div>
    
    <div class="social-icons" role="navigation" aria-label="Социальные сети">
      <a href="https://www.youtube.com/@blogcheloveka" target="_blank" rel="noopener noreferrer" class="youtube" aria-label="YouTube канал">📺 YouTube</a>
      <a href="https://t.me/blogchelovecka" target="_blank" rel="noopener noreferrer" class="telegram" aria-label="Личный Telegram">💬 Личный TG</a>
      <a href="https://t.me/gramradiochill" target="_blank" rel="noopener noreferrer" class="telegram" aria-label="Telegram радио">🎵 Радио TG</a>
      <a href="#" target="_blank" rel="noopener noreferrer" aria-label="Веб-сайт">🌐 Веб-сайт</a>
    </div>
    
    <a href="https://pressf.com/radiogram/donate" target="_blank" rel="noopener noreferrer" class="donate-button" aria-label="Помочь разработчику">
      ❤️ Помочь разработчику
    </a>
    
    <div class="sleep-timer-container">
      <button class="sleep-timer-btn" id="sleepTimerBtn" aria-label="Таймер сна">
        ⏳ Спать
      </button>
      <div class="sleep-timer-options" id="sleepTimerOptions">
        <button class="sleep-time-option" data-minutes="15">15 мин</button>
        <button class="sleep-time-option" data-minutes="30">30 мин</button>
        <button class="sleep-time-option" data-minutes="60">60 мин</button>
      </div>
      <div class="sleep-timer-display" id="sleepTimerDisplay"></div>
    </div>
  </div>

  <div class="chat-container" role="region" aria-label="Чат эфира">
    <div class="chat-header">💬 ЧАТ ЭФИРА</div>
    <div class="chat-messages" id="chatMessages" role="log" aria-live="polite" aria-relevant="additions">
      <div class="chat-message">
        <div class="message-nick">Система</div>
        <div class="message-text">Добро пожаловать в эфир! 🔥</div>
        <div class="message-time">Сейчас</div>
      </div>
    </div>
    <div class="chat-input-wrapper">
      <input type="text" id="chatInput" placeholder="Сообщение..." autocomplete="off" aria-label="Введите сообщение" maxlength="500">
      <button onclick="sendMessage()" aria-label="Отправить сообщение">➤</button>
    </div>
    <div class="error-message" id="chatError" role="alert"></div>
  </div>

  <div class="nick-modal" id="nickModal" role="dialog" aria-labelledby="modalTitle" aria-modal="true">
    <div class="modal-box">
      <h3 id="modalTitle">Представься</h3>
      <p>Это будет твой ник в чате</p>
      <input type="text" id="nickInput" placeholder="@username" aria-label="Ваш никнейм" maxlength="20" pattern="[a-zA-Z0-9_@]{3,20}">
      <div class="error-message" id="nickError" role="alert"></div>
      <button onclick="saveNick()" aria-label="Войти в эфир">Войти в эфир</button>
    </div>
  </div>

  <!-- Аквариумные рыбки -->
  <div class="fish" id="fish1" style="top: 20%; left: -50px;">
    <svg viewBox="0 0 40 25" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="18" cy="12.5" rx="12" ry="8" fill="#ff6b6b"/>
      <ellipse cx="28" cy="12.5" rx="8" ry="6" fill="#ff8787"/>
      <polygon points="35,12.5 40,8 40,17" fill="#ff6b6b"/>
      <circle cx="14" cy="10" r="2" fill="#fff"/>
      <circle cx="14" cy="10" r="1" fill="#000"/>
      <path d="M 18 12.5 Q 22 8 28 10" stroke="#ff8787" stroke-width="1" fill="none"/>
    </svg>
  </div>
  <div class="fish" id="fish2" style="top: 70%; left: -50px;">
    <svg viewBox="0 0 40 25" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="18" cy="12.5" rx="12" ry="8" fill="#4ecdc4"/>
      <ellipse cx="28" cy="12.5" rx="8" ry="6" fill="#6ee7df"/>
      <polygon points="35,12.5 40,8 40,17" fill="#4ecdc4"/>
      <circle cx="14" cy="10" r="2" fill="#fff"/>
      <circle cx="14" cy="10" r="1" fill="#000"/>
      <path d="M 18 12.5 Q 22 8 28 10" stroke="#6ee7df" stroke-width="1" fill="none"/>
    </svg>
  </div>

  <script>
    // === КОНСТАНТЫ ===
    const CONSTANTS = {
      STREAM_URL: 'https://radiogram.su/listen/radio_gram/radio.mp3',
      API_URL: 'https://radiogram.su/api/nowplaying/radio_gram',
      CHAT_API: '/.netlify/functions/send-chat',
      MAX_NICK_LENGTH: 20,
      MIN_NICK_LENGTH: 3,
      MAX_MESSAGE_LENGTH: 500,
      MAX_CHAT_HISTORY: 50,
      RECONNECT_DELAY: 3000,
      UPDATE_INTERVAL: 30000
    };

    // === ФУНКЦИЯ БЕЗОПАСНОСТИ (XSS защита) ===
    function escapeHtml(text) {
      if (typeof text !== 'string') return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // === ВАЛИДАЦИЯ НИКА ===
    function validateNick(nick) {
      const trimmed = nick.trim();
      if (trimmed.length < CONSTANTS.MIN_NICK_LENGTH) {
        return { valid: false, error: `Минимум ${CONSTANTS.MIN_NICK_LENGTH} символа` };
      }
      if (trimmed.length > CONSTANTS.MAX_NICK_LENGTH) {
        return { valid: false, error: `Максимум ${CONSTANTS.MAX_NICK_LENGTH} символов` };
      }
      if (!/^[a-zA-Z0-9_@]+$/.test(trimmed)) {
        return { valid: false, error: 'Только буквы, цифры, _ и @' };
      }
      return { valid: true, value: trimmed };
    }

    // === АУДИО ПЛЕЕР ===
    let audio = null;
    let isPlaying = false;
    let reconnectTimer = null;
    let isBuffering = false;
    
    // Эквалайзер
    let equalizerContainer = null;
    let equalizerInterval = null;
    const eqBars = [];

    const playBtn = document.getElementById('playBtn');
    const statusText = document.getElementById('statusText');
    equalizerContainer = document.getElementById('equalizerContainer');
    
    // Инициализация полосок эквалайзера
    for (let i = 1; i <= 8; i++) {
      eqBars.push(document.getElementById(`eqBar${i}`));
    }

    const pauseIconSVG = `<svg class="pause-icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect x="16" y="14" width="12" height="36" rx="4" />
      <rect x="36" y="14" width="12" height="36" rx="4" />
    </svg>`;
    
    const gramIconSVG = `<svg class="gram-icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M 14 22 L 32 52 L 50 22" />
      <path d="M 14 22 L 50 22" />
      <path d="M 32 22 L 32 37" />
    </svg>`;

    function initAudio() {
      if (!audio) {
        audio = new Audio();
        audio.preload = 'none';
        audio.crossOrigin = 'anonymous';
        
        // Обработка ошибок аудио
        audio.addEventListener('error', handleAudioError);
        audio.addEventListener('waiting', () => {
          isBuffering = true;
          statusText.textContent = '⏳ Буферизация...';
          statusText.className = 'status buffering';
        });
        audio.addEventListener('playing', () => {
          isBuffering = false;
          statusText.textContent = '🔴 СЕЙЧАС ИГРАЕТ';
          statusText.className = 'status success';
        });
        audio.addEventListener('stalled', handleAudioError);
      }
    }

    function handleAudioError() {
      console.error('Ошибка аудио потока');
      statusText.textContent = '⚠️ Потеряно соединение. Переподключение...';
      statusText.className = 'status error';
      
      // Автоматическое переподключение
      if (reconnectTimer) clearTimeout(reconnectTimer);
      reconnectTimer = setTimeout(() => {
        if (isPlaying && audio) {
          statusText.textContent = '🔄 Переподключение...';
          statusText.className = 'status buffering';
          audio.src = CONSTANTS.STREAM_URL;
          audio.play().catch(err => {
            console.error('Не удалось переподключиться:', err);
            stopPlayback();
          });
        }
      }, CONSTANTS.RECONNECT_DELAY);
    }

    function stopPlayback() {
      if (audio) {
        audio.pause();
        audio.src = '';
      }
      isPlaying = false;
      isBuffering = false;
      if (reconnectTimer) clearTimeout(reconnectTimer);
      playBtn.innerHTML = gramIconSVG;
      playBtn.classList.remove('playing', 'paused');
      playBtn.classList.add('paused');
      playBtn.setAttribute('aria-pressed', 'false');
      statusText.textContent = '⏸ ПАУЗА';
      statusText.className = 'status';
      equalizerContainer.classList.remove('active');
      stopEqualizer();
    }

    async function togglePlayback() {
      initAudio();
      
      if (!isPlaying) {
        try {
          statusText.textContent = '⏳ Подключение...';
          statusText.className = 'status buffering';
          
          audio.src = CONSTANTS.STREAM_URL;
          await audio.play();
          
          playBtn.innerHTML = pauseIconSVG;
          playBtn.classList.remove('paused');
          playBtn.classList.add('playing');
          equalizerContainer.classList.add('active');
          startEqualizer();
          playBtn.setAttribute('aria-pressed', 'true');
          statusText.textContent = '🔴 СЕЙЧАС ИГРАЕТ';
          statusText.className = 'status success';
          isPlaying = true;
        } catch (err) {
          console.error('Ошибка воспроизведения:', err);
          statusText.textContent = '❌ Ошибка подключения';
          statusText.className = 'status error';
          stopPlayback();
        }
      } else {
        stopPlayback();
      }
    }

    // Обработчики событий плеера
    playBtn.addEventListener('click', togglePlayback);
    
    // Горячие клавиши
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && e.target.tagName !== 'INPUT') {
        e.preventDefault();
        togglePlayback();
      }
    });

    // Очистка при закрытии страницы
    window.addEventListener('beforeunload', () => {
      if (reconnectTimer) clearTimeout(reconnectTimer);
      if (audio) {
        audio.pause();
        audio.src = '';
      }
      clearSleepTimer();
      stopEqualizer();
      // Очищаем все таймеры
      const maxId = window.setTimeout(() => {}, 0);
      for (let i = 1; i <= maxId; i++) {
        clearTimeout(i);
      }
    });

    // === СЧЁТЧИК СЛУШАТЕЛЕЙ ===
    async function updateListenerCount() {
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 5000);
        
        const response = await fetch(CONSTANTS.API_URL, { 
          signal: controller.signal,
          headers: { 'Accept': 'application/json' }
        });
        clearTimeout(timeoutId);
        
        if (!response.ok) throw new Error('HTTP error');
        
        const data = await response.json();
        const listeners = data.listeners?.total || 0;
        
        const countEl = document.getElementById('listenerCount');
        const listenersEl = document.querySelector('.listeners-count');
        
        if (countEl) countEl.textContent = listeners;
        
        if (listeners > 0) {
          if (listenersEl) {
            listenersEl.className = 'listeners-count active';
          }
          if (isPlaying && !isBuffering) {
            statusText.textContent = '🔴 СЕЙЧАС ИГРАЕТ';
            statusText.className = 'status success';
          }
        } else {
          if (listenersEl) {
            listenersEl.className = 'listeners-count offline';
          }
        }
      } catch (error) {
        console.error('Ошибка статистики:', error.message);
      }
    }

    // Запускаем обновление счётчика
    updateListenerCount();
    const statsInterval = setInterval(updateListenerCount, CONSTANTS.UPDATE_INTERVAL);

    // === ЭМОДЗИ АНИМАЦИЯ ===
    const emojis = ['😊', '❤️', '👍', '🔥', '✨', '🎵', '💯', '🌟', '💪'];
    let emojiTimer = null;
    
    function showRandomEmoji() {
      const emoji = document.createElement('div');
      emoji.className = 'emoji';
      emoji.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      
      const x = Math.random() * (window.innerWidth - 50);
      const y = Math.random() * (window.innerHeight - 50);
      
      emoji.style.left = x + 'px';
      emoji.style.top = y + 'px';
      
      document.body.appendChild(emoji);
      
      setTimeout(() => {
        emoji.remove();
      }, 4000);
      
      scheduleNextEmoji();
    }
    
    function scheduleNextEmoji() {
      if (emojiTimer) clearTimeout(emojiTimer);
      const delay = Math.random() * 2000 + 5000; // 5-7 секунд
      emojiTimer = setTimeout(showRandomEmoji, delay);
    }
    
    // Запуск анимации эмодзи
    emojiTimer = setTimeout(scheduleNextEmoji, 5000);

    // === ТАЙМЕР СНА ===
    let sleepTimer = null;
    let sleepTimeRemaining = 0;
    let sleepInterval = null;
    
    const sleepTimerBtn = document.getElementById('sleepTimerBtn');
    const sleepTimerOptions = document.getElementById('sleepTimerOptions');
    const sleepTimerDisplay = document.getElementById('sleepTimerDisplay');
    const sleepTimeOptions = document.querySelectorAll('.sleep-time-option');
    
    sleepTimerBtn.addEventListener('click', () => {
      sleepTimerOptions.classList.toggle('show');
      sleepTimerBtn.classList.toggle('active');
    });
    
    sleepTimeOptions.forEach(option => {
      option.addEventListener('click', () => {
        const minutes = parseInt(option.dataset.minutes);
        setSleepTimer(minutes);
        
        sleepTimeOptions.forEach(opt => opt.classList.remove('selected'));
        option.classList.add('selected');
        
        sleepTimerOptions.classList.remove('show');
      });
    });
    
    function setSleepTimer(minutes) {
      clearSleepTimer();
      
      sleepTimeRemaining = minutes * 60 * 1000;
      const endTime = Date.now() + sleepTimeRemaining;
      
      updateSleepTimerDisplay(sleepTimeRemaining);
      
      sleepInterval = setInterval(() => {
        sleepTimeRemaining = endTime - Date.now();
        
        if (sleepTimeRemaining <= 0) {
          clearInterval(sleepInterval);
          stopPlayback();
          sleepTimerDisplay.textContent = '💤 Таймер выключил радио';
          sleepTimerBtn.classList.remove('active');
          sleepTimeOptions.forEach(opt => opt.classList.remove('selected'));
          
          setTimeout(() => {
            sleepTimerDisplay.textContent = '';
          }, 5000);
        } else {
          updateSleepTimerDisplay(sleepTimeRemaining);
        }
      }, 1000);
    }
    
    function updateSleepTimerDisplay(ms) {
      const totalSeconds = Math.floor(ms / 1000);
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;
      
      let display = '⏳ Осталось: ';
      if (hours > 0) {
        display += `${hours}ч `;
      }
      display += `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
      
      sleepTimerDisplay.textContent = display;
    }
    
    function clearSleepTimer() {
      if (sleepInterval) {
        clearInterval(sleepInterval);
        sleepInterval = null;
      }
      sleepTimeRemaining = 0;
    }
    
    // === ЭКВАЛАЙЗЕР ===
    function startEqualizer() {
      if (equalizerInterval) clearInterval(equalizerInterval);
      
      // Позиционируем полоски по кругу
      const radius = 70; // радиус круга
      const centerX = 80; // центр контейнера 160px / 2
      const centerY = 80;
      const totalBars = eqBars.length;
      
      eqBars.forEach((bar, index) => {
        const angle = (index / totalBars) * Math.PI * 2 - Math.PI / 2;
        const x = centerX + radius * Math.cos(angle) - 3; // -3 это половина ширины полоски
        const y = centerY + radius * Math.sin(angle);
        
        bar.style.left = x + 'px';
        bar.style.top = y + 'px';
        bar.style.height = '20px';
        bar.style.transform = `rotate(${angle + Math.PI / 2}rad)`;
      });
      
      // Анимация эквалайзера
      equalizerInterval = setInterval(() => {
        eqBars.forEach((bar, index) => {
          // Создаем эффект волны с разной высотой для каждой полоски
          const baseHeight = 15 + Math.random() * 25;
          const waveOffset = Math.sin(Date.now() / 200 + index * 0.5) * 15;
          const height = Math.max(10, baseHeight + waveOffset);
          
          bar.style.height = height + 'px';
          
          // Меняем цвет в зависимости от высоты
          const hue = 140 + (height / 40) * 40; // от зеленого к бирюзовому
          bar.style.background = `linear-gradient(180deg, hsl(${hue}, 70%, 60%), hsl(${hue}, 80%, 40%), hsl(${hue}, 70%, 60%))`;
          bar.style.boxShadow = `0 0 ${height/3}px rgba(52, 211, 153, 0.8)`;
        });
      }, 100);
    }
    
    function stopEqualizer() {
      if (equalizerInterval) {
        clearInterval(equalizerInterval);
        equalizerInterval = null;
      }
      // Сбрасываем высоту полосок
      eqBars.forEach(bar => {
        bar.style.height = '20px';
      });
    }

    // === УПРАВЛЕНИЕ НИКОМ ===
    const nickModal = document.getElementById('nickModal');
    const nickInput = document.getElementById('nickInput');
    const nickError = document.getElementById('nickError');

    function showNickError(message) {
      nickError.textContent = message;
      nickError.classList.add('visible');
      setTimeout(() => nickError.classList.remove('visible'), 3000);
    }

    function saveNick() {
      const validation = validateNick(nickInput.value);
      if (!validation.valid) {
        showNickError(validation.error);
        return;
      }
      
      localStorage.setItem('radioGramNick', validation.value);
      nickModal.classList.add('hidden');
    }

    // Проверка сохранённого ника при загрузке
    const savedNick = localStorage.getItem('radioGramNick');
    if (savedNick) {
      const validation = validateNick(savedNick);
      if (validation.valid) {
        nickModal.classList.add('hidden');
      } else {
        localStorage.removeItem('radioGramNick');
      }
    }

    // === ЧАТ ===
    const chatInput = document.getElementById('chatInput');
    const chatMessages = document.getElementById('chatMessages');
    const chatError = document.getElementById('chatError');
    let chatHistory = [];

    function loadChatHistory() {
      const saved = localStorage.getItem('radioGramChatHistory');
      if (saved) {
        try {
          chatHistory = JSON.parse(saved);
          // Восстанавливаем последние сообщения
          chatHistory.slice(-CONSTANTS.MAX_CHAT_HISTORY).forEach(msg => {
            renderMessage(msg.nick, msg.text, msg.time, false);
          });
        } catch (e) {
          console.error('Ошибка загрузки истории чата:', e);
        }
      }
    }

    function saveChatHistory() {
      localStorage.setItem('radioGramChatHistory', JSON.stringify(chatHistory));
    }

    function showChatError(message) {
      chatError.textContent = message;
      chatError.classList.add('visible');
      setTimeout(() => chatError.classList.remove('visible'), 3000);
    }

    function renderMessage(nick, text, time, scroll = true) {
      const div = document.createElement('div');
      div.className = 'chat-message';
      
      const safeNick = escapeHtml(nick);
      const safeText = escapeHtml(text);
      
      div.innerHTML = `
        <div class="message-nick">${safeNick}</div>
        <div class="message-text">${safeText}</div>
        <div class="message-time">${time}</div>
      `;
      chatMessages.appendChild(div);
      
      // Ограничиваем историю в DOM
      const messages = chatMessages.querySelectorAll('.chat-message');
      if (messages.length > CONSTANTS.MAX_CHAT_HISTORY) {
        messages[0].remove();
      }
      
      if (scroll) {
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }
    }

    function addMessageToHistory(nick, text) {
      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      chatHistory.push({ nick, text, time });
      
      // Ограничиваем размер истории
      if (chatHistory.length > CONSTANTS.MAX_CHAT_HISTORY) {
        chatHistory.shift();
      }
      
      saveChatHistory();
      return time;
    }

    async function sendMessage() {
      const text = chatInput.value.trim();
      if (!text) return;

      if (text.length > CONSTANTS.MAX_MESSAGE_LENGTH) {
        showChatError(`Сообщение слишком длинное (макс. ${CONSTANTS.MAX_MESSAGE_LENGTH})`);
        return;
      }

      const nick = localStorage.getItem('radioGramNick') || 'Аноним';
      const time = addMessageToHistory(nick, text);
      renderMessage(nick, text, time);
      sendToTelegram(nick, text);
      chatInput.value = '';

      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 5000);
        
        await fetch(CONSTANTS.CHAT_API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nick: nick, text: text }),
          signal: controller.signal
        });
        clearTimeout(timeoutId);
      } catch (err) {
        console.log('Чат работает локально:', err.message);
        // Сообщение сохранено в истории, просто не отправлено на сервер
      }
    }
// === ФУНКЦИЯ ПОЛУЧЕНИЯ СООБЩЕНИЙ ИЗ TELEGRAM ===
const displayedMessageIds = new Set(); // Защита от дубликатов

async function getMessagesFromTelegram() {
  try {
    const response = await fetch('https://radiogram-backend-production.up.railway.app/api/get-from-telegram');
    const data = await response.json();
    
    if (data.messages && data.messages.length > 0) {
      for (const msg of data.messages) {
        // Если такого ID еще нет в списке отображенных
        if (!displayedMessageIds.has(msg.id)) {
          // Добавляем в историю и отображаем на сайте
          const time = addMessageToHistory(msg.user, msg.message);
          renderMessage(msg.user, msg.message, time);
          
          // Запоминаем ID, чтобы не показать снова
          displayedMessageIds.add(msg.id);
        }
      }
    }
  } catch (error) {
    console.error('Failed to get messages from Telegram:', error);
  }
}

// Запускаем опрос каждые 3 секунды
setInterval(getMessagesFromTelegram, 3000);
// Первый запрос через 1 секунду после загрузки
setTimeout(getMessagesFromTelegram, 1000);
    // Обработчики событий чата
    chatInput.addEventListener('keypress', e => {
      if (e.key === 'Enter') sendMessage();
    });
    
    nickInput.addEventListener('keypress', e => {
      if (e.key === 'Enter') saveNick();
    });

    // Загрузка истории чата при старте
    loadChatHistory();

    // === PWA SUPPORT (Service Worker registration placeholder) ===
    if ('serviceWorker' in navigator) {
      // Можно зарегистрировать service worker для офлайн поддержки
      // navigator.serviceWorker.register('/sw.js');
    }

    // === АКВАРИУМНЫЕ РЫБКИ ===
    const fish1 = document.getElementById('fish1');
    const fish2 = document.getElementById('fish2');
    
    function initFish() {
      const fishes = [fish1, fish2];
      
      fishes.forEach((fish, index) => {
        // Начальная позиция и направление
        let x = Math.random() * window.innerWidth;
        let y = Math.random() * (window.innerHeight - 100);
        let speedX = (Math.random() * 1.5 + 0.5) * (Math.random() > 0.5 ? 1 : -1);
        let speedY = (Math.random() * 0.5 + 0.2) * (Math.random() > 0.5 ? 1 : -1);
        let direction = speedX > 0 ? 'right' : 'left';
        
        fish.style.left = x + 'px';
        fish.style.top = y + 'px';
        
        // Плавное движение
        function swim() {
          x += speedX;
          y += speedY;
          
          // Отталкивание от краев экрана
          if (x <= -50) {
            x = -50;
            speedX = Math.abs(speedX);
            direction = 'right';
          } else if (x >= window.innerWidth - 10) {
            x = window.innerWidth - 10;
            speedX = -Math.abs(speedX);
            direction = 'left';
          }
          
          if (y <= 50 || y >= window.innerHeight - 50) {
            speedY = -speedY;
          }
          
          // Поворот рыбки в направлении движения
          if (direction === 'left') {
            fish.classList.add('swimming-left');
          } else {
            fish.classList.remove('swimming-left');
          }
          
          fish.style.left = x + 'px';
          fish.style.top = y + 'px';
          
          requestAnimationFrame(swim);
        }
        
        swim();
        
        // Клик по рыбке - она уплывает в другую сторону
        fish.addEventListener('click', () => {
          speedX = -speedX * 3; // Ускорение и смена направления
          speedY = -speedY * 2;
          
          // Возврат к нормальной скорости через 2 секунды
          setTimeout(() => {
            speedX = speedX > 0 ? Math.abs(speedX) / 3 : -Math.abs(speedX) / 3;
            speedY = speedY > 0 ? Math.abs(speedY) / 2 : -Math.abs(speedY) / 2;
          }, 2000);
        });
      });
    }
    
    // Запуск рыбок после загрузки страницы
    setTimeout(initFish, 1000);

 // === ФУНКЦИЯ ОТПРАВКИ В TELEGRAM ===
async function sendToTelegram(user, message) {
  try {
    await fetch('https://radiogram-backend-production.up.railway.app/api/send-to-telegram', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user: user, message: message })
    });
    console.log('Message sent to Telegram');
  } catch (error) {
    console.error('Telegram error:', error);
  }
}
