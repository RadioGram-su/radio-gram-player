        <ellipse cx="34" cy="17.5" rx="10" ry="7" fill="#1e90ff"/>
        <polygon points="42,17.5 50,12 50,23" fill="#0077be"/>
        <circle cx="18" cy="14" r="3" fill="#fff"/>
        <circle cx="18" cy="14" r="1.5" fill="#000"/>
        <circle cx="30" cy="20" r="2" fill="#000080"/>
        <path d="M 22 17.5 Q 28 10 36 13" stroke="#1e90ff" stroke-width="1.5" fill="none"/>
      </g>
    </svg>
  </div>

  <!-- Улитка -->
  <div class="snail" id="snail">🐌</div>
  <div class="snail-dialog" id="snailDialog"></div>

  <script>
    // Аудио плеер
    let audio = null;
    let isPlaying = false;
    const playBtn = document.getElementById('playBtn');
    const statusText = document.getElementById('statusText');
    const equalizer = document.getElementById('equalizer');
    const STREAM_URL = 'https://radiogram.su/listen/radio_gram/radio.mp3';

    const playIconSVG = '<svg class="play-icon" viewBox="0 0 64 64"><path d="M 20 12 L 52 32 L 20 52 Z" /></svg>';
    const pauseIconSVG = '<svg class="pause-icon" viewBox="0 0 64 64"><rect x="20" y="14" width="10" height="36" rx="2"/><rect x="34" y="14" width="10" height="36" rx="2"/></svg>';

    playBtn.addEventListener('click', togglePlayback);

    async function togglePlayback() {
      if (!isPlaying) {
        if (!audio) {
          audio = new Audio(STREAM_URL);
          audio.crossOrigin = 'anonymous';
        }
        
        try {
          await audio.play();
          isPlaying = true;
          playBtn.classList.add('playing');
          playBtn.innerHTML = pauseIconSVG;
          equalizer.classList.add('active');
          statusText.textContent = '▶️ СЕЙЧАС ИГРАЕТ';
        } catch (err) {
          statusText.textContent = '❌ Ошибка подключения';
        }
      } else {
        audio.pause();
        isPlaying = false;
        playBtn.classList.remove('playing');
        playBtn.innerHTML = playIconSVG;
        equalizer.classList.remove('active');
        statusText.textContent = '⏸ ПАУЗА';
      }
    }

    // Меню каналов
    function toggleChannelsMenu() {
      const menu = document.getElementById('channelsMenu');
      menu.classList.toggle('show');
    }

    // Закрыть меню при клике вне его
    document.addEventListener('click', (e) => {
      const menu = document.getElementById('channelsMenu');
      const btn = e.target.closest('button[onclick="toggleChannelsMenu()"]');
      if (!btn && !menu.contains(e.target)) {
        menu.classList.remove('show');
      }
    });

    // Счетчик слушателей
    async function updateListenerCount() {
      try {
        const response = await fetch('https://radiogram.su/api/nowplaying/radio_gram');
        const data = await response.json();
        document.getElementById('listenerCount').textContent = data.listeners?.unique || 0;
      } catch (e) {
        console.error('Ошибка статистики:', e);
      }
    }
    setInterval(updateListenerCount, 30000);
    updateListenerCount();

    // Чат
    function sendMessage() {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (text) {
        const messages = document.getElementById('chatMessages');
        const msg = document.createElement('div');
        msg.className = 'chat-message';
        msg.innerHTML = `<div class="message-nick">Вы</div><div class="message-text">${text}</div>`;
        messages.appendChild(msg);
        messages.scrollTop = messages.scrollHeight;
        input.value = '';
      }
    }

    document.getElementById('chatInput')?.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    // Рыбки с анимацией
    const fish1 = document.getElementById('fish1');
    const fish2 = document.getElementById('fish2');
    const fishDialog = document.getElementById('fishDialog');
    
    function animateFish(fish, startX, startY, showDialog = false) {
      let x = startX;
      let y = startY;
      let speedX = 0.5;
      let speedY = 0.2;
      let lastDialogTime = Date.now();
      
      function swim() {
        x += speedX;
        y += speedY + Math.sin(Date.now() / 1000) * 0.3;
        
        if (x <= -60 || x >= window.innerWidth - 20) speedX *= -1;
        if (y <= 40 || y >= window.innerHeight - 40) speedY *= -1;
        
        fish.style.left = x + 'px';
        fish.style.top = y + 'px';
        fish.style.transform = `scaleX(${speedX > 0 ? 1 : -1})`;
        
        if (showDialog && fish === fish1 && fishDialog) {
          const now = Date.now();
          if (now - lastDialogTime > 15000 && Math.random() < 0.001) {
            fishDialog.style.left = (x + 25) + 'px';
            fishDialog.style.top = (y - 40) + 'px';
            fishDialog.classList.add('visible');
            lastDialogTime = now;
            
            setTimeout(() => {
              fishDialog.classList.remove('visible');
            }, 3000);
          }
          
          if (fishDialog.classList.contains('visible')) {
            fishDialog.style.left = (x + 25) + 'px';
            fishDialog.style.top = (y - 40) + 'px';
          }
        }
        
        requestAnimationFrame(swim);
      }
      swim();
    }
    
    animateFish(fish1, Math.random() * window.innerWidth, Math.random() * window.innerHeight * 0.3, true);
    animateFish(fish2, Math.random() * window.innerWidth, window.innerHeight * 0.6 + Math.random() * 100, false);

    // Улитка
    const snail = document.getElementById('snail');
    const snailDialog = document.getElementById('snailDialog');
    const snailPhrases = [
      'не трогай меня! Я просто ползу 🐌',
      'я устала, я ухожу! 😴',
      'на что я трачу свою жизнь ((( 💭'
    ];
    
    let snailX = 20;
    let snailY = window.innerHeight - 60;
    let snailDirection = 0;
    let lastTrailTime = Date.now();
    
    function moveSnail() {
      const speed = 0.3;
      const margin = 20;
      const maxX = window.innerWidth - 60;
      const maxY = window.innerHeight - 60;
      
      switch(snailDirection) {
        case 0:
          snailX += speed;
          if (snailX >= maxX) snailDirection = 1;
          break;
        case 1:
          snailY -= speed;
          if (snailY <= margin) snailDirection = 2;
          break;
        case 2:
          snailX -= speed;
          if (snailX <= margin) snailDirection = 3;
          break;
        case 3:
          snailY += speed;
          if (snailY >= maxY) snailDirection = 0;
          break;
      }
      
      snail.style.left = snailX + 'px';
      snail.style.bottom = (window.innerHeight - snailY - 40) + 'px';
      
      const now = Date.now();
      if (now - lastTrailTime > 5000) {
        createSnailTrail(snailX + 20, snailY + 20);
        lastTrailTime = now;
      }
      
      requestAnimationFrame(moveSnail);
    }
    
    function createSnailTrail(x, y) {
      const trail = document.createElement('div');
      trail.className = 'snail-trail';
      trail.style.left = x + 'px';
      trail.style.top = y + 'px';
      document.body.appendChild(trail);
      setTimeout(() => trail.remove(), 5000);
    }
    
    snail.addEventListener('click', () => {
      const phrase = snailPhrases[Math.floor(Math.random() * snailPhrases.length)];
      snailDialog.textContent = phrase;
      snailDialog.classList.add('show');
      
      function updateDialogPos() {
        if (snailDialog.classList.contains('show')) {
          const rect = snail.getBoundingClientRect();
          snailDialog.style.left = (rect.left + rect.width / 2) + 'px';
          snailDialog.style.bottom = (window.innerHeight - rect.top + 10) + 'px';
          requestAnimationFrame(updateDialogPos);
        }
      }
      updateDialogPos();
      
      setTimeout(() => {
        snailDialog.classList.remove('show');
      }, 3000);
    });
    
    moveSnail();

    // Таймер сна
    let sleepTimer = null;
    let sleepTimeRemaining = 0;
    let sleepInterval = null;

    const sleepTimerBtn = document.getElementById('sleepTimerBtn');
    const sleepTimerOptions = document.getElementById('sleepTimerOptions');
    const sleepTimerDisplay = document.getElementById('sleepTimerDisplay');
    const sleepTimeOptions = document.querySelectorAll('.sleep-time-option');

    sleepTimerBtn.addEventListener('click', () => {
      sleepTimerOptions.classList.toggle('show');
    });

    sleepTimeOptions.forEach(option => {
      option.addEventListener('click', () => {
        const minutes = parseInt(option.dataset.minutes);
        setSleepTimer(minutes);
        sleepTimerOptions.classList.remove('show');
      });
    });

    function setSleepTimer(minutes) {
      clearSleepTimer();
      sleepTimeRemaining = minutes * 60 * 1000;
      const endTime = Date.now() + sleepTimeRemaining;

      sleepInterval = setInterval(() => {
        sleepTimeRemaining = endTime - Date.now();

        if (sleepTimeRemaining <= 0) {
          clearInterval(sleepInterval);
          if (isPlaying) togglePlayback();
          sleepTimerDisplay.textContent = '💤 Радио выключено';
          
          setTimeout(() => {
            sleepTimerDisplay.textContent = '';
          }, 5000);
        } else {
          const totalSeconds = Math.floor(sleepTimeRemaining / 1000);
          const mins = Math.floor(totalSeconds / 60);
          const secs = totalSeconds % 60;
          sleepTimerDisplay.textContent = `⏳ ${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }
      }, 1000);
    }

    function clearSleepTimer() {
      if (sleepInterval) {
        clearInterval(sleepInterval);
        sleepInterval = null;
      }
    }

    // Динамический фон
    const beachImages = [
      'images/i.jpg',
      'images/8i.jpg',
      'images/i2.jpg'
    ];
    
    function updateBackground() {
      const bg = document.getElementById('oceanBackground');
      const hour = new Date().getHours();
      let index = 0;
      
      if (hour >= 5 && hour < 12) index = 0;
      else if (hour >= 12 && hour < 17) index = 1;
      else index = 2;
      
      const img = new Image();
      img.onload = () => {
        bg.style.backgroundImage = `url('${beachImages[index]}')`;
      };
      img.onerror = () => {
        bg.style.background = 'linear-gradient(135deg, #1e3c72 0%, #2a5298 100%)';
      };
      img.src = beachImages[index];
    }
    
    updateBackground();
    setInterval(updateBackground, 3600000);

    // Счетчик посетителей
    function updateUniqueUsers() {
      const today = new Date().toDateString();
      const stored = localStorage.getItem('visitorsDate');
      let count = parseInt(localStorage.getItem('visitorsCount') || '50');
      
      if (stored !== today) {
        count = Math.floor(Math.random() * 300) + 50;
        localStorage.setItem('visitorsDate', today);
        localStorage.setItem('visitorsCount', count);
      }
      
      document.getElementById('uniqueUsersCount').textContent = count;
    }
    updateUniqueUsers();
    setInterval(updateUniqueUsers, 300000);

    function openDonateModal() {
      window.open('https://pressf.com/radiogram/donate', '_blank');
    }
  </script>
</body>
</html>
