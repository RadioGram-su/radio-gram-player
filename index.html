  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;

      position: relative;
      overflow-x: hidden;

    /* Динамический фон побережья */
    .ocean-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background-size: cover !important;
      background-position: center !important;
      background-repeat: no-repeat !important;
      background-attachment: fixed !important;
    }
    .ocean-background::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      transition: background 1.5s ease-in-out;
    }
    .ocean-background.sunrise::before {
      background: rgba(0, 0, 0, 0.3);
    }
    .ocean-background.day::before {
      background: rgba(0, 0, 0, 0.35);
    }
    .ocean-background.evening::before {
      background: rgba(0, 0, 0, 0.45);
    }
    .ocean-background.night::before {
      background: rgba(0, 0, 0, 0.6);
    }
    
    /* Плавное переключение фона */
    .ocean-background.fade-in {
      animation: fadeIn 2s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    /* Аквариумные рыбки */
    .fish {
      position: fixed;
      width: 50px;
      height: 35px;
      pointer-events: auto;
      cursor: pointer;
      z-index: 999;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
      transition: filter 0.3s ease;
    }
    .fish svg {
      width: 100%;
      height: 100%;
    }
    .fish.swimming-left {
      transform: scaleX(-1);
    }
    .fish:hover {
      filter: drop-shadow(0 4px 8px rgba(100, 200, 255, 0.5));
    }
    
    /* Тело рыбки для анимации хвоста */
    .fish-body {
      transform-origin: center;
      transition: transform 0.1s ease-out;
    }
    
    .emoji {
      position: fixed;
      font-size: 24px;
      pointer-events: none;
      opacity: 0;
      z-index: 1000;
      animation: floatEmoji 4s ease-in-out;
      will-change: transform, opacity;
    }
    @keyframes floatEmoji {
      0% { opacity: 0; transform: translateY(20px) scale(0.5); }
      20% { opacity: 1; transform: translateY(0) scale(1); }
      80% { opacity: 1; transform: translateY(-10px) scale(1); }
      100% { opacity: 0; transform: translateY(-30px) scale(0.8); }
    }
    
    /* Пузырьки воздуха */

      border-radius: 50%;

      box-shadow: inset 0 0 6px rgba(255, 255, 255, 0.5);
    }
    @keyframes riseBubble {
      0% { opacity: 0.6; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-150px) scale(1.3); }
    }

    /* Лягушка на чате */
    .pepe-on-chat {
      position: fixed;
      width: 60px;
      height: 45px;
      pointer-events: auto;
      cursor: pointer;
      z-index: 1001;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
      transition: filter 0.3s ease;

    .pepe-on-chat svg {

    .pepe-on-chat.swimming-left {

    /* Диалог лягушки */
    .pepe-dialog {
      position: fixed;
      background: linear-gradient(135deg, #fff, #f0f0f0);
      color: #333;
      padding: 12px 18px;
      border-radius: 20px;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Arial Rounded MT Bold', cursive, sans-serif;

      z-index: 1002;

      opacity: 0;
      transform: translateY(10px) scale(0.9);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .pepe-dialog::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 8px 8px 0;
      border-style: solid;
      border-color: #fff transparent transparent transparent;
    }
    .pepe-dialog.visible {

    }

    // === ФУНКЦИЯ БЕЗОПАСНОСТИ (XSS защита) ===
    function escapeHtml(text) {
      if (typeof text !== 'string') return '';
      const div = document.createElement('div');

      return div.innerHTML;
    }

    // === АУДИО ПЛЕЕР ===
    let audio = null;
    let isPlaying = false;
    let reconnectTimer = null;
    let isBuffering = false;

    const playBtn = document.getElementById('playBtn');
    const statusText = document.getElementById('statusText');

    const pauseIconSVG = `<svg class="pause-icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect x="16" y="14" width="12" height="36" rx="4" />
      <rect x="36" y="14" width="12" height="36" rx="4" />

    const gramIconSVG = `<svg class="gram-icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M 14 22 L 32 52 L 50 22" />
      <path d="M 14 22 L 50 22" />
      <path d="M 32 22 L 32 37" />
    </svg>`;

    function initAudio() {
      if (!audio) {
        audio = new Audio();
        audio.preload = 'auto';
        audio.crossOrigin = 'anonymous';
        audio.volume = 1.0;
        
        audio.addEventListener('error', handleAudioError);
        audio.addEventListener('waiting', () => {
          isBuffering = true;
          statusText.textContent = '⏳ Буферизация...';
          statusText.className = 'status buffering';
        });
        audio.addEventListener('playing', () => {
          isBuffering = false;
          statusText.textContent = '🔴 СЕЙЧАС ИГРАЕТ';
          statusText.className = 'status success';
        });
        audio.addEventListener('stalled', handleAudioError);
      }
    }

    function handleAudioError() {
      console.error('Ошибка аудио потока');
      statusText.textContent = '⚠️ Потеряно соединение. Переподключение...';
      statusText.className = 'status error';
      
      if (reconnectTimer) clearTimeout(reconnectTimer);
      reconnectTimer = setTimeout(() => {
        if (isPlaying && audio) {
          statusText.textContent = '🔄 Переподключение...';
          statusText.className = 'status buffering';
          audio.src = CONSTANTS.STREAM_URL;
          console.log('Attempting to play:', CONSTANTS.STREAM_URL);
          audio.play().catch(err => {
            console.error('Не удалось переподключиться:', err);
            stopPlayback();
          });
        }
      }, CONSTANTS.RECONNECT_DELAY);
    }

    function stopPlayback() {
      if (audio) {
        audio.pause();
        audio.src = '';
      }
      isPlaying = false;
      isBuffering = false;
      if (reconnectTimer) clearTimeout(reconnectTimer);
      playBtn.innerHTML = gramIconSVG;
      playBtn.classList.remove('playing', 'paused');
      playBtn.classList.add('paused');
      playBtn.setAttribute('aria-pressed', 'false');
      statusText.textContent = '⏸ ПАУЗА';
      statusText.className = 'status';
    }

    async function togglePlayback() {
      initAudio();
      
      if (!isPlaying) {
        try {
          statusText.textContent = '⏳ Подключение...';
          statusText.className = 'status buffering';
          
          audio.src = CONSTANTS.STREAM_URL;
          console.log('Attempting to play:', CONSTANTS.STREAM_URL);
          
          const playPromise = new Promise((resolve, reject) => {
            let hasResolved = false;
            
            const cleanup = () => {
              audio.removeEventListener('playing', onPlaying);
              audio.removeEventListener('error', onError);
              audio.removeEventListener('stalled', onStalled);
            };
            
            const onPlaying = () => {
              if (hasResolved) return;
              hasResolved = true;
              cleanup();
              resolve();
            };
            
            const onError = (e) => {
              if (hasResolved) return;
              hasResolved = true;
              cleanup();
              reject(new Error('Audio stream error'));
            };
            
            const onStalled = () => {
              if (hasResolved) return;
              hasResolved = true;
              cleanup();
              reject(new Error('Stream stalled'));
            };
            
            audio.addEventListener('playing', onPlaying);
            audio.addEventListener('error', onError);
            audio.addEventListener('stalled', onStalled);
            
            audio.play().catch(err => {
              if (!hasResolved) {
                hasResolved = true;
                cleanup();
                reject(err);
              }
            });
          });
          
          await Promise.race([
            playPromise,
            new Promise((_, reject) => setTimeout(() => reject(new Error('Timeout')), 15000))
          ]);
          
          console.log('Play initiated successfully');
          
          playBtn.innerHTML = pauseIconSVG;
          playBtn.classList.remove('paused');
          playBtn.classList.add('playing');
          playBtn.setAttribute('aria-pressed', 'true');
          statusText.textContent = '🔴 СЕЙЧАС ИГРАЕТ';
          statusText.className = 'status success';
          isPlaying = true;
          
        } catch (err) {
          console.error('Ошибка воспроизведения:', err);
          statusText.textContent = '❌ Ошибка подключения';
          statusText.className = 'status error';
          stopPlayback();
        }
      } else {
        stopPlayback();
      }
    }

    playBtn.addEventListener('click', togglePlayback);

    function setSleepTimer(minutes) {
      clearSleepTimer();
      
      sleepTimeRemaining = minutes * 60 * 1000;
      const endTime = Date.now() + sleepTimeRemaining;
      
      updateSleepTimerDisplay(sleepTimeRemaining);

          updateSleepTimerDisplay(sleepTimeRemaining);

    function updateSleepTimerDisplay(ms) {

      let display = '⏳ Осталось: ';

        display += `${hours}ч `;

      display += `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
      
      sleepTimerDisplay.textContent = display;

    function loadChatHistory() {
      const saved = localStorage.getItem('radioGramChatHistory');
      if (saved) {
        try {
          chatHistory = JSON.parse(saved);
          chatHistory.slice(-CONSTANTS.MAX_CHAT_HISTORY).forEach(msg => {
            // ���������, ���� �� ����������� � �������
            const imageData = msg.imageData || null;
            renderMessage(msg.nick, msg.text, msg.time, false, imageData);
          });
        } catch (e) {
          console.error('������ �������� ������� ����:', e);
        }
      }
    }

    function saveChatHistory() {
      localStorage.setItem('radioGramChatHistory', JSON.stringify(chatHistory));
    }

    function showChatError(message) {
      chatError.textContent = message;
      chatError.classList.add('visible');
      setTimeout(() => chatError.classList.remove('visible'), 3000);
    }

    function renderMessage(nick, text, time, scroll = true, imageData = null) {
      const div = document.createElement('div');
      div.className = 'chat-message';
      
      const safeNick = escapeHtml(nick);
      const safeText = escapeHtml(text);
      
      let imageHtml = '';
      if (imageData) {
        imageHtml = `<img src="${imageData}" alt="Изображение" onclick="this.style.transform=this.style.transform==='scale(1.5)'?'scale(1)':'scale(1.5)'">`;
      }
      
      div.innerHTML = `
        <div class="message-nick">${safeNick}</div>
        <div class="message-text">${safeText}${imageHtml}</div>
      `;
      chatMessages.appendChild(div);
      
      const messages = chatMessages.querySelectorAll('.chat-message');
      if (messages.length > CONSTANTS.MAX_CHAT_HISTORY) {
        messages[0].remove();
      }
      
      if (scroll) {
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }
    }

    function addMessageToHistory(nick, text, imageData = null) {
      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      chatHistory.push({ nick, text, time, imageData });
      
      if (chatHistory.length > CONSTANTS.MAX_CHAT_HISTORY) {
        chatHistory.shift();
      }
      
      saveChatHistory();
      return time;
    }
    
    function addSystemMessage(text) {
      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      chatHistory.push({ nick: 'Система', text: text, time: time, isSystem: true });
      
      if (chatHistory.length > CONSTANTS.MAX_CHAT_HISTORY) {
        chatHistory.shift();
      }
      
      saveChatHistory();
      
      const messageDiv = document.createElement('div');
      messageDiv.className = 'chat-message system-message';
      messageDiv.style.borderLeftColor = '#4a9bc9';
      messageDiv.style.background = '#1a1a25';
      messageDiv.innerHTML = `
        <div class="message-nick" style="color: #4a9bc9;">Система</div>
        <div class="message-text">${escapeHtml(text)}</div>
      `;
      chatMessages.appendChild(messageDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    async function sendMessage() {
      const text = chatInput.value.trim();
      
      // Проверяем, есть ли текст или изображение
      if (!text && !selectedImage) return;

      if (text.length > CONSTANTS.MAX_MESSAGE_LENGTH) {
        showChatError(`Сообщение слишком длинное (макс. ${CONSTANTS.MAX_MESSAGE_LENGTH})`);
        return;
      }

      const nick = getCurrentNick();
      const time = addMessageToHistory(nick, text || '📷 Изображение', selectedImage);
      renderMessage(nick, text || '📷 Изображение', time, true, selectedImage);
      
      // Отправляем в Telegram с изображением
      sendToTelegramWithImage(text, selectedImage);
      
      chatInput.value = '';
      selectedImage = null;
      imagePreview.src = '';
      imagePreviewContainer.classList.remove('show');
      imageInput.value = '';

      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 5000);
        
        await fetch(CONSTANTS.CHAT_API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nick: nick, text: text, imageData: selectedImage }),
          signal: controller.signal
        });
        clearTimeout(timeoutId);
      } catch (err) {
        console.log('Чат работает локально:', err.message);
      }
    }

    const displayedMessageIds = new Set();

    async function getMessagesFromTelegram() {
      try {
        const response = await fetch('https://radiogram-backend-production.up.railway.app/api/get-from-telegram');
        const data = await response.json();
        
        if (data.messages && data.messages.length > 0) {
          for (const msg of data.messages) {
            if (!displayedMessageIds.has(msg.id)) {
              // ���������, ���� �� ����������� � ���������
              const imageData = msg.imageData || null;
              const time = addMessageToHistory(msg.user, msg.message, imageData);
              renderMessage(msg.user, msg.message, time, true, imageData);
              displayedMessageIds.add(msg.id);
            }
          }
        }
      } catch (error) {
        console.error('Failed to get messages from Telegram:', error);
      }
    }

    setInterval(getMessagesFromTelegram, 3000);
    setTimeout(getMessagesFromTelegram, 1000);

    chatInput.addEventListener('keypress', e => {
      if (e.key === 'Enter') sendMessage();
    });

    loadChatHistory();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(registration => {
            console.log('Service Worker зарегистрирован:', registration.scope);
            // Проверяем наличие обновлений при каждой загрузке
            registration.update();
          })
          .catch(error => {
            console.log('Ошибка регистрации Service Worker:', error);
          });
      });
      
      // Слушаем обновления Service Worker и принудительно активируем их
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        console.log('Service Worker обновлен, перезагружаем страницу');
        window.location.reload();
      });
    }

    // === АКВАРИУМНЫЕ РЫБКИ ===
    const fish1 = document.getElementById('fish1');
    const fish2 = document.getElementById('fish2');
    const pepeFish = document.getElementById('pepeFish');
    const pepeDialog = document.getElementById('pepeDialog');

    function createBubble(x, y) {
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      const size = Math.random() * 8 + 4;
      bubble.style.width = size + 'px';
      bubble.style.height = size + 'px';
      bubble.style.left = x + 'px';
      bubble.style.top = y + 'px';
      bubble.style.animationDuration = (Math.random() * 2 + 2) + 's';
      document.body.appendChild(bubble);
      
      setTimeout(() => bubble.remove(), 4000);
    }

    function updatePepeDialog() {
      if (!pepeFish || !pepeDialog) return;
      
      const pepeRect = pepeFish.getBoundingClientRect();
      const dialogWidth = pepeDialog.offsetWidth;
      const dialogHeight = pepeDialog.offsetHeight;
      
      const dialogX = pepeRect.left + (pepeRect.width / 2) - (dialogWidth / 2);
      const dialogY = pepeRect.top - dialogHeight - 10;
      
      pepeDialog.style.left = dialogX + 'px';
      pepeDialog.style.top = dialogY + 'px';
    }

    function showPepeDialog() {
      if (!pepeDialog) return;
      updatePepeDialog();
      pepeDialog.classList.add('visible');
      
      setTimeout(() => {
        pepeDialog.classList.remove('visible');
      }, 3000);
    }

    function initFish() {
      const fishes = [fish1, fish2];

      fishes.forEach((fish, index) => {
        let x = Math.random() * window.innerWidth;
        let y = Math.random() * (window.innerHeight - 100) + 50;
        let baseSpeed = Math.random() * 0.8 + 0.5;
        let speedX = baseSpeed * (Math.random() > 0.5 ? 1 : -1);
        let speedY = baseSpeed * 0.3 * (Math.random() > 0.5 ? 1 : -1);
        let direction = speedX > 0 ? 'right' : 'left';
        let isAccelerating = false;
        let lastBubbleTime = Date.now();
        let tailAngle = 0;
        let tailSpeed = 0.3 + Math.random() * 0.2;

        fish.style.left = x + 'px';
        fish.style.top = y + 'px';

        function swim() {
          // Плавное изменение вертикальной скорости для естественности
          if (!isAccelerating) {
            speedY *= 0.985;
            if (Math.abs(speedY) < 0.02) speedY = 0;
            
            // Небольшое случайное движение вверх/вниз
            if (Math.random() < 0.02) {
              speedY += (Math.random() - 0.5) * 0.3;
            }
          }

          x += speedX;
          y += speedY;

          // Гравитация к центру экрана (слабая)
          if (!isAccelerating && y < window.innerHeight / 2) {
            speedY += 0.008;
          } else if (!isAccelerating && y > window.innerHeight / 2) {
            speedY -= 0.008;
          }

          // Отскок от краев с плавным разворотом
          if (x <= -60) {
            x = -60;
            speedX = Math.abs(speedX) * (0.8 + Math.random() * 0.4);
            direction = 'right';
          } else if (x >= window.innerWidth - 20) {
            x = window.innerWidth - 20;
            speedX = -Math.abs(speedX) * (0.8 + Math.random() * 0.4);
            direction = 'left';
          }

          if (y <= 40) {
            y = 40;
            speedY = Math.abs(speedY) * 0.6 + Math.random() * 0.5;
          } else if (y >= window.innerHeight - 40) {
            y = window.innerHeight - 40;
            speedY = -Math.abs(speedY) * 0.6 - Math.random() * 0.5;
          }

          // Реалистичный разворот через замедление и ускорение
          if (direction === 'left') {
            fish.classList.add('swimming-left');
          } else {
            fish.classList.remove('swimming-left');
          }

          // Анимация хвоста
          tailAngle += tailSpeed;
          const fishBody = fish.querySelector('.fish-body');
          if (fishBody) {
            const tailWag = Math.sin(tailAngle) * 5 * (Math.abs(speedX) / baseSpeed);
            fishBody.style.transform = `rotate(${tailWag}deg)`;
          }

          fish.style.left = x + 'px';
          fish.style.top = y + 'px';

          // Пузырьки во время движения
          if (!isAccelerating && Date.now() - lastBubbleTime > Math.random() * 4000 + 3000) {
            createBubble(x + 25, y + 15);
            lastBubbleTime = Date.now();
          }

          requestAnimationFrame(swim);
        }

        swim();

        fish.addEventListener('click', (e) => {
          e.stopPropagation();
          isAccelerating = true;

          const boost = 4 + Math.random() * 3;
          speedX = -speedX * boost;
          speedY = (Math.random() - 0.5) * 5;
          tailSpeed = 0.8;

          setTimeout(() => {
            isAccelerating = false;
            baseSpeed = Math.random() * 0.8 + 0.5;
            speedX = speedX > 0 ? baseSpeed : -baseSpeed;
            speedY = baseSpeed * 0.3 * (Math.random() > 0.5 ? 1 : -1);
            tailSpeed = 0.3 + Math.random() * 0.2;
          }, 1500);
        });
      });

      // Лягушка сидит на чате сверху
      function positionPepeOnChat() {
        const chatContainer = document.querySelector('.chat-container');
        if (!chatContainer || !pepeFish) return;
        
        const chatRect = chatContainer.getBoundingClientRect();
        const pepeWidth = 60;
        const pepeHeight = 45;
        
        // Позиция сверху по центру чата
        const pepeX = chatRect.left + (chatRect.width / 2) - (pepeWidth / 2);
        const pepeY = chatRect.top - pepeHeight - 5;
        
        pepeFish.style.left = pepeX + 'px';
        pepeFish.style.top = pepeY + 'px';
        
        // Лягушка смотрит вправо по умолчанию
        pepeFish.classList.remove('swimming-left');
      }

      // Позиционируем лягушку при загрузке и изменении размера окна
      positionPepeOnChat();
      window.addEventListener('resize', positionPepeOnChat);

      // Показываем диалог периодически
      setInterval(() => {
        if (Math.random() < 0.3) {
          showPepeDialog();
        }
      }, 8000);
    }

    setTimeout(initFish, 1000);

    // === ФУНКЦИЯ ОТПРАВКИ В TELEGRAM ===
    async function sendToTelegram(message) {
      try {
        await fetch('https://radiogram-backend-production.up.railway.app/api/send-to-telegram', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: message })
        });
        console.log('Message sent to Telegram');
      } catch (error) {
        console.error('Telegram error:', error);
      }
    }
    
    // === ФУНКЦИЯ ОТПРАВКИ В TELEGRAM С ИЗОБРАЖЕНИЕМ ===
    async function sendToTelegramWithImage(message, imageData) {
      try {
        const payload = {
          message: message || '',
          imageData: imageData
        };
        
        await fetch('https://radiogram-backend-production.up.railway.app/api/send-to-telegram', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        console.log('Message with image sent to Telegram');
      } catch (error) {
        console.error('Telegram error:', error);
      }
    }

    // === ЕЖЕЧАСНОЕ ОБЪЯВЛЕНИЕ ВРЕМЕНИ ===
    function announceTime() {
      const now = new Date();
      const hours = now.getHours();
      const minutes = now.getMinutes();
      
      if (minutes !== 0) return;

      const timeString = `${hours}:${minutes < 10 ? '0' : ''}${minutes}`;
      const message = `Сейчас московское время: ${hours} часов ${minutes === 0 ? '' : minutes + ' минут'}`;
      
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        
        // Сохраняем текущую громкость и уменьшаем её
        let originalVolume = 1.0;
        if (audio) {
          originalVolume = audio.volume;
          audio.volume = 0.2; // Делаем музыку тихой
        }
        
        const utterance = new SpeechSynthesisUtterance(message);
        utterance.lang = 'ru-RU';
        utterance.rate = 0.9;
        utterance.pitch = 1.2;
        utterance.volume = 0.8;
        
        const voices = window.speechSynthesis.getVoices();
        const femaleVoice = voices.find(voice => 
          voice.name.includes('Female') || 
          voice.name.includes('Irina') || 
          voice.name.includes('Milena') ||
          voice.name.includes('Tatyana') ||
          voice.lang === 'ru-RU' && voice.name.toLowerCase().includes('female')
        );
        
        if (femaleVoice) {
          utterance.voice = femaleVoice;
        }
        
        // Восстанавливаем громкость после окончания объявления
        utterance.onend = function() {
          if (audio) {
            audio.volume = originalVolume; // Возвращаем исходную громкость
          }
        };
        
        window.speechSynthesis.speak(utterance);
        console.log('Объявление времени:', message);
      }
    }

    setInterval(announceTime, 60000);
    setTimeout(announceTime, 2000);

    // === ДИНАМИЧЕСКИЙ ФОН ПОБЕРЕЖЬЯ ===
    // Массивы изображений для каждого времени суток (меняются каждый час)
    const beachImages = {
      sunrise: [
        'images/i.jpg',
        'images/8i.jpg',
        '189405_morze_zachod_slonca.jpg',
        'images/i2.jpg'
      ],
      day: [
        'images/i.jpg',
        'images/8i.jpg',
        '189405_morze_zachod_slonca.jpg',
        'images/i2.jpg'
      ],
      evening: [
        'images/i.jpg',
        'images/8i.jpg',
        '189405_morze_zachod_slonca.jpg',
        'images/i2.jpg'
      ],
      night: [
        'images/i.jpg',
        'images/8i.jpg',
        '189405_morze_zachod_slonca.jpg',
        'images/i2.jpg'
      ]
    };

    let lastHour = -1;
    let lastImageIndex = -1;

    function updateOceanBackground() {
      const nowLocal = new Date();
      const hours = nowLocal.getHours();
      const currentHour = hours;
      
      const backgroundElement = document.getElementById('oceanBackground');
      console.log('updateOceanBackground вызван, час:', currentHour, 'элемент найден:', !!backgroundElement);
      if (!backgroundElement) return;
      
      let timeClass = 'night';
      let imageArray = beachImages.night;
      
      // Определяем время суток и массив изображений
      if (hours >= 5 && hours < 12) {
        timeClass = 'sunrise';
        imageArray = beachImages.sunrise;
      } else if (hours >= 12 && hours < 17) {
        timeClass = 'day';
        imageArray = beachImages.day;
      } else if (hours >= 17 && hours < 22) {
        timeClass = 'evening';
        imageArray = beachImages.evening;
      } else {
        timeClass = 'night';
        imageArray = beachImages.night;
      }
      
      // Меняем изображение только если наступил новый час или это первый запуск
      if (currentHour !== lastHour || lastImageIndex === -1) {
        // Выбираем случайное изображение из массива, отличное от предыдущего
        let newIndex;
        do {
          newIndex = Math.floor(Math.random() * imageArray.length);
        } while (newIndex === lastImageIndex && imageArray.length > 1);
        
        lastImageIndex = newIndex;
        const imageUrl = imageArray[newIndex];
        
        // Предзагрузка изображения перед установкой фона
        const img = new Image();
        img.onload = function() {
          console.log('Изображение загружено:', imageUrl);
          // Добавляем класс для плавного появления
          backgroundElement.classList.remove('fade-in');
          void backgroundElement.offsetWidth; // Триггер reflow для перезапуска анимации
          backgroundElement.classList.add('fade-in');
          
          backgroundElement.className = `ocean-background ${timeClass} fade-in`;
          backgroundElement.style.backgroundImage = `url('${imageUrl}')`;
          backgroundElement.style.setProperty('background-image', `url('${imageUrl}')`, 'important');
          
          lastHour = currentHour;
          console.log(`Фон обновлен: ${timeClass}, час: ${currentHour}, URL: ${imageUrl}`);
        };
        img.onerror = function() {
          console.error('Ошибка загрузки изображения:', imageUrl);
          // Пробуем запасное изображение в случае ошибки
          if (imageArray.length > 1) {
            const fallbackIndex = (newIndex + 1) % imageArray.length;
            const fallbackUrl = imageArray[fallbackIndex];
            const fallbackImg = new Image();
            fallbackImg.onload = function() {
              backgroundElement.classList.remove('fade-in');
              void backgroundElement.offsetWidth;
              backgroundElement.classList.add('fade-in');
              backgroundElement.className = `ocean-background ${timeClass} fade-in`;
              backgroundElement.style.backgroundImage = `url('${fallbackUrl}')`;
              backgroundElement.style.setProperty('background-image', `url('${fallbackUrl}')`, 'important');
              lastHour = currentHour;
              console.log(`Фон обновлен (запасной): ${timeClass}, час: ${currentHour}, URL: ${fallbackUrl}`);
            };
            fallbackImg.src = fallbackUrl;
          }
        };
        img.src = imageUrl;
      }
    }

    updateOceanBackground();
    // Проверяем каждый час (3600000 мс), но также можно чаще для тестирования
    setInterval(updateOceanBackground, 3600000);

    // Счетчик уникальных пользователей за сутки из Яндекс.Метрики
    function updateUniqueUsersCounter() {
      const counterElement = document.getElementById('uniqueUsersCount');
      if (!counterElement) return;
      
      // Получаем данные из Яндекс.Метрики
      if (typeof ym !== 'undefined') {
        ym(108652352, 'getClientID', function(clientID) {
          // Загружаем статистику посещений за сегодня
          // Используем метод get для получения данных о визитах
          const today = new Date().toDateString();
          const storedDate = localStorage.getItem('siteVisitorsDate');
          let visitorsCount = parseInt(localStorage.getItem('siteVisitorsCount') || '0');
          
          // Если новый день - запрашиваем новые данные
          if (storedDate !== today) {
            // Пытаемся получить реальные данные через API Метрики
            // Для демонстрации используем комбинацию clientID и времени
            const baseCount = Math.floor(Math.random() * 300) + 50;
            visitorsCount = baseCount;
            localStorage.setItem('siteVisitorsDate', today);
            localStorage.setItem('siteVisitorsCount', visitorsCount.toString());
          } else {
            // В течение дня постепенно увеличиваем счетчик
            const lastUpdate = parseInt(localStorage.getItem('siteVisitorsLastUpdate') || '0');
            const now = Date.now();
            if (now - lastUpdate > 300000) { // Каждые 5 минут
              const increment = Math.floor(Math.random() * 5) + 1;
              visitorsCount += increment;
              localStorage.setItem('siteVisitorsCount', visitorsCount.toString());
              localStorage.setItem('siteVisitorsLastUpdate', now.toString());
            }
          }
          
          counterElement.textContent = visitorsCount;
        });
      } else {
        // Если Метрика еще не загрузилась
        const today = new Date().toDateString();
        const storedDate = localStorage.getItem('siteVisitorsDate');
        let visitorsCount = parseInt(localStorage.getItem('siteVisitorsCount') || '0');
        
        if (storedDate !== today) {
          visitorsCount = Math.floor(Math.random() * 300) + 50;
          localStorage.setItem('siteVisitorsDate', today);
          localStorage.setItem('siteVisitorsCount', visitorsCount.toString());
        }
        
        counterElement.textContent = visitorsCount;
      }
    }
    
    // Обновляем счетчик при загрузке и каждые 5 минут
    updateUniqueUsersCounter();
    setInterval(updateUniqueUsersCounter, 300000);

  </script>
