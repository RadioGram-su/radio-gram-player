<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Radio Gram">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
 <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; connect-src 'self' https://api.radiogram.su https://radiogram.su https://radiogram-backend-production.up.railway.app https://stream.zeno.fm https://*.zeno.fm; img-src 'self' https: data: blob:; media-src 'self' blob: https://radiogram.su https://stream.zeno.fm https://*.zeno.fm; object-src 'none'; frame-src 'self' https://www.youtube.com;">
  <title>Radio Gram</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    
    /* Динамический фон побережья */
    .ocean-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background-size: cover !important;
      background-position: center !important;
      background-repeat: no-repeat !important;
      background-attachment: fixed !important;
    }
    .ocean-background::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      transition: background 1.5s ease-in-out;
    }
    .ocean-background.sunrise::before {
      background: rgba(0, 0, 0, 0.3);
    }
    .ocean-background.day::before {
      background: rgba(0, 0, 0, 0.35);
    }
    .ocean-background.evening::before {
      background: rgba(0, 0, 0, 0.45);
    }
    .ocean-background.night::before {
      background: rgba(0, 0, 0, 0.6);
    }
    
    /* Плавное переключение фона */
    .ocean-background.fade-in {
      animation: fadeIn 2s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    /* Аквариумные рыбки */
    .fish {
      position: fixed;
      width: 40px;
      height: 25px;
      pointer-events: auto;
      cursor: pointer;
      z-index: 999;
      transition: transform 0.3s ease;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
    }
    .fish svg {
      width: 100%;
      height: 100%;
    }
    .fish.swimming-left {
      transform: scaleX(-1);
    }
    .fish:hover {
      filter: drop-shadow(0 4px 8px rgba(100, 200, 255, 0.5));
    }
    
    .emoji {
      position: fixed;
      font-size: 24px;
      pointer-events: none;
      opacity: 0;
      z-index: 1000;
      animation: floatEmoji 4s ease-in-out;
      will-change: transform, opacity;
    }
    @keyframes floatEmoji {
      0% { opacity: 0; transform: translateY(20px) scale(0.5); }
      20% { opacity: 1; transform: translateY(0) scale(1); }
      80% { opacity: 1; transform: translateY(-10px) scale(1); }
      100% { opacity: 0; transform: translateY(-30px) scale(0.8); }
    }
    
    /* Пузырьки воздуха */
    .bubble {
      position: fixed;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.8), rgba(100, 200, 255, 0.4));
      pointer-events: none;
      z-index: 998;
      animation: riseBubble linear forwards;
      box-shadow: inset 0 0 6px rgba(255, 255, 255, 0.5);
    }
    @keyframes riseBubble {
      0% { opacity: 0.6; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-150px) scale(1.3); }
    }

    /* Лягушка Pepe */
    .pepe-fish {
      position: fixed;
      width: 50px;
      height: 35px;
      pointer-events: auto;
      cursor: pointer;
      z-index: 1001;
      transition: transform 0.3s ease;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
    }
    .pepe-fish svg {
      width: 100%;
      height: 100%;
    }
    .pepe-fish.swimming-left {
      transform: scaleX(-1);
    }
    .pepe-fish:hover {
      filter: drop-shadow(0 4px 8px rgba(100, 255, 100, 0.6));
      transform: scale(1.1);
    }
    
    /* Диалог лягушки */
    .pepe-dialog {
      position: fixed;
      background: linear-gradient(135deg, #fff, #f0f0f0);
      color: #333;
      padding: 12px 18px;
      border-radius: 20px;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Arial Rounded MT Bold', cursive, sans-serif;
      font-size: 13px;
      font-weight: bold;
      white-space: nowrap;
      pointer-events: none;
      z-index: 1002;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3), 0 0 0 3px rgba(76, 175, 80, 0.4);
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .pepe-dialog::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 8px 8px 0;
      border-style: solid;
      border-color: #fff transparent transparent transparent;
    }
    .pepe-dialog.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .player-wrapper { text-align: center; margin-bottom: 40px; position: relative; z-index: 10; }
    
    .play-button {
      width: 120px; height: 120px; border-radius: 50%;
      background: radial-gradient(circle at 30% 20%, #4a4a4f, #1a1a1e 80%);
      border: none;
      cursor: pointer;
      margin: 0 auto 25px; transition: all 0.3s ease;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.1);
      position: relative;
      z-index: 2;
      will-change: transform;
    }
    .play-button:hover { 
      transform: scale(1.03);
      background: radial-gradient(circle at 30% 20%, #55555a, #222226 80%);
    }
    .play-button:active { transform: scale(0.98); }
    .play-button:focus-visible {
      outline: 3px solid #ff3b30;
      outline-offset: 4px;
    }
    
    .play-button.paused {
      box-shadow: 0 0 25px rgba(255, 59, 48, 0.5), 0 8px 25px rgba(0, 0, 0, 0.6);
    }
    
    .play-button.playing {
      box-shadow: 0 0 35px rgba(52, 211, 153, 0.6), 0 8px 25px rgba(0, 0, 0, 0.6);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 30px rgba(52, 211, 153, 0.5), 0 8px 25px rgba(0, 0, 0, 0.6); }
      50% { box-shadow: 0 0 50px rgba(52, 211, 153, 0.8), 0 8px 25px rgba(0, 0, 0, 0.6); }
    }
    
    .gram-icon {
      width: 55px; height: 55px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 7;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
      transition: all 0.3s;
    }

    .pause-icon {
      width: 50px; height: 50px;
      fill: #ffffff;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
      transition: all 0.3s;
    }
    
    .main-title { font-size: 36px; font-weight: 700; letter-spacing: 4px; margin-bottom: 8px; }
    .sub-title { font-size: 11px; color: #666; letter-spacing: 3px; margin-bottom: 20px; }
    .status { color: #ff3b30; font-size: 12px; margin-bottom: 10px; min-height: 18px; }
    .status.error { color: #ef4444; }
    .status.success { color: #4ade80; }
    .status.buffering { color: #fbbf24; }
    .listeners-count { 
      color: #4ade80; 
      font-size: 12px; 
      margin-bottom: 25px;
      font-weight: bold;
      text-shadow: 0 0 10px rgba(74, 222, 128, 0.5);
      transition: color 0.3s ease;
    }
    .listeners-count.active {
      color: #00ff88;
      text-shadow: 0 0 15px rgba(0, 255, 136, 0.7);
    }
    .listeners-count.offline {
      color: #ff6600;
      text-shadow: 0 0 10px rgba(255, 102, 0, 0.5);
    }
    
    .social-icons { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }
    .social-icons a {
      padding: 10px 20px; border-radius: 25px;
      background: #1a1a1a; color: #fff; text-decoration: none;
      transition: all 0.3s; font-size: 14px; border: 2px solid #333;
    }
    .social-icons a:hover { 
      background: #ff3b30; 
      border-color: #ff3b30;
      transform: translateY(-3px); 
    }
    .social-icons a:focus-visible {
      outline: 2px solid #ff3b30;
      outline-offset: 2px;
    }
    .social-icons a.youtube:hover { background: #ff0000; border-color: #ff0000; }
    .social-icons a.telegram:hover { background: #0088cc; border-color: #0088cc; }
    
    .donate-button {
      display: inline-block;
      margin-top: 25px;
      padding: 14px 32px;
      border-radius: 30px;
      background: linear-gradient(135deg, #667eea, #764ba2, #f093fb, #667eea);
      background-size: 300% 300%;
      color: #fff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 1px;
      border: none;
      cursor: pointer;
      transition: all 0.4s ease;
      box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);
      animation: gradientPulse 4s ease infinite, gentlePulse 2s ease-in-out infinite;
      position: relative;
      overflow: hidden;
    }
    .donate-button:hover {
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 8px 30px rgba(102, 126, 234, 0.6);
    }
    .donate-button:active {
      transform: translateY(-1px) scale(1.02);
    }
    .donate-button:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 3px;
    }
    @keyframes gradientPulse {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes gentlePulse {
      0%, 100% { 
        box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);
        transform: scale(1);
      }
      50% { 
        box-shadow: 0 6px 25px rgba(118, 75, 162, 0.5);
        transform: scale(1.03);
      }
    }
    
    .sleep-timer-container {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .sleep-timer-btn {
      padding: 12px 24px;
      border-radius: 25px;
      background: linear-gradient(135deg, #1e3a5f, #2d5a87);
      color: #fff;
      border: 2px solid #3a7ca5;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(30, 58, 95, 0.4);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sleep-timer-btn:hover {
      background: linear-gradient(135deg, #2d5a87, #3a7ca5);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(58, 124, 165, 0.5);
    }
    .sleep-timer-btn.active {
      background: linear-gradient(135deg, #3a7ca5, #4a9bc9);
      box-shadow: 0 0 20px rgba(58, 124, 165, 0.7);
      animation: timerPulse 2s ease-in-out infinite;
    }
    @keyframes timerPulse {
      0%, 100% { box-shadow: 0 0 15px rgba(58, 124, 165, 0.5); }
      50% { box-shadow: 0 0 25px rgba(58, 124, 165, 0.8); }
    }
    .sleep-timer-options {
      display: none;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 10px;
    }
    .sleep-timer-options.show {
      display: flex;
    }
    .sleep-time-option {
      padding: 10px 20px;
      border-radius: 20px;
      background: #1a1a1e;
      color: #fff;
      border: 2px solid #333;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .sleep-time-option:hover {
      background: #2d5a87;
      border-color: #3a7ca5;
      transform: scale(1.05);
    }
    .sleep-time-option.selected {
      background: #3a7ca5;
      border-color: #4a9bc9;
      box-shadow: 0 0 15px rgba(58, 124, 165, 0.6);
    }
    .sleep-timer-display {
      font-size: 12px;
      color: #4a9bc9;
      min-height: 18px;
      font-weight: 600;
      text-shadow: 0 0 10px rgba(74, 155, 201, 0.5);
    }
    
    .chat-container {
      width: 100%; max-width: 450px; background: #0a0a0a;
      border: 1px solid #222; border-radius: 12px; overflow: hidden;
      position: relative; z-index: 10;
    }
    .chat-header {
      background: #111; padding: 12px; text-align: center;
      font-size: 13px; font-weight: 600; letter-spacing: 1.5px;
      border-bottom: 1px solid #222;
    }
    .chat-messages {
      height: 280px; overflow-y: auto; padding: 12px;
      display: flex; flex-direction: column; gap: 8px;
      scroll-behavior: smooth;
    }
    .chat-messages::-webkit-scrollbar { width: 5px; }
    .chat-messages::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
    .chat-messages[aria-live="polite"] { }
    .chat-message {
      background: #151515; padding: 10px; border-radius: 8px;
      border-left: 3px solid #ff3b30; animation: slideIn 0.3s ease;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-10px); }
      to { opacity: 1; transform: translateX(0); }
    }
    .message-nick { font-size: 12px; color: #ff3b30; font-weight: 600; margin-bottom: 4px; }
    .message-text { font-size: 13px; line-height: 1.4; word-wrap: break-word; }
    .chat-input-wrapper {
      padding: 12px; background: #111; display: flex;
      gap: 8px; border-top: 1px solid #222;
    }
    .chat-input-wrapper input {
      flex: 1; padding: 10px 15px; border-radius: 20px;
      border: 1px solid #333; background: #0a0a0a;
      color: #fff; font-size: 13px; outline: none;
    }
    .chat-input-wrapper input:focus { border-color: #ff3b30; }
    .chat-input-wrapper input:focus-visible {
      outline: 2px solid #ff3b30;
      outline-offset: 2px;
    }
    .chat-input-wrapper button {
      width: 44px; height: 40px; border-radius: 50%;
      border: none; background: #ff3b30; color: #fff;
      cursor: pointer; font-size: 16px; transition: all 0.3s;
    }
    .chat-input-wrapper button:hover { background: #ff5750; transform: scale(1.1); }
    .chat-input-wrapper button:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 2px;
    }
    .error-message {
      color: #ef4444;
      font-size: 12px;
      margin-top: 8px;
      display: none;
    }
    .error-message.visible {
      display: block;
    }
    @media (max-width: 600px) {
      body { padding: 15px; }
      .main-title { font-size: 28px; }
      .play-button { width: 100px; height: 100px; }
      .gram-icon { width: 45px; height: 45px; }
      .pause-icon { width: 40px; height: 40px; }
      .chat-messages { height: 240px; }
      .social-icons a { padding: 8px 16px; font-size: 12px; }
    }
    
    /* Счетчик уникальных пользователей - ненавязчивый стиль */
    .unique-users-counter {
      position: fixed;
      top: 12px;
      right: 12px;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.6);
      z-index: 10000;
      letter-spacing: 0.5px;
      backdrop-filter: blur(3px);
      transition: all 0.3s ease;
      opacity: 0.7;
    }
    .unique-users-counter:hover {
      opacity: 1;
      background: rgba(0, 0, 0, 0.7);
      color: rgba(255, 255, 255, 0.9);
    }
    @media (max-width: 600px) {
      .unique-users-counter {
        top: 8px;
        right: 8px;
        padding: 5px 8px;
        font-size: 10px;
      }
    }
  </style>
</head>
<body>
  <!-- Динамический фон побережья океана -->
  <div class="ocean-background" id="oceanBackground"></div>
  
  <!-- Счетчик уникальных пользователей -->
  <div class="unique-users-counter" id="uniqueUsersCounter">👥 <span id="uniqueUsersCount">--</span></div>
  
  <div class="player-wrapper">
    <button class="play-button paused" id="playBtn" aria-label="Play/Pause" aria-pressed="false" role="button" tabindex="0">
      <svg class="gram-icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M 14 22 L 32 52 L 50 22" />
        <path d="M 14 22 L 50 22" />
        <path d="M 32 22 L 32 37" />
      </svg>
    </button>
    <div class="main-title">GRAM</div>
    <div class="sub-title">RADIO STREAM</div>
    <div class="status" id="statusText" role="status" aria-live="polite">Нажми для старта</div>
    <div class="listeners-count">🔊 Слушателей: <span id="listenerCount">0</span></div>
    
    <div class="social-icons" role="navigation" aria-label="Социальные сети">
      <a href="https://www.youtube.com/@blogcheloveka" target="_blank" rel="noopener noreferrer" class="youtube" aria-label="YouTube канал">📺 YouTube</a>
      <a href="https://t.me/blogchelovecka" target="_blank" rel="noopener noreferrer" class="telegram" aria-label="Личный Telegram">💬 Личный TG</a>
      <a href="https://t.me/gramradiochill" target="_blank" rel="noopener noreferrer" class="telegram" aria-label="Telegram радио">🎵 Радио TG</a>
      <a href="#" target="_blank" rel="noopener noreferrer" aria-label="Веб-сайт">🌐 Веб-сайт</a>
    </div>
    
    <a href="https://pressf.com/radiogram/donate" target="_blank" rel="noopener noreferrer" class="donate-button" aria-label="Помочь разработчику">
      ❤️ Помочь разработчику
    </a>
    
    <div class="sleep-timer-container">
      <button class="sleep-timer-btn" id="sleepTimerBtn" aria-label="Таймер сна">
        ⏳ Спать
      </button>
      <div class="sleep-timer-options" id="sleepTimerOptions">
        <button class="sleep-time-option" data-minutes="15">15 мин</button>
        <button class="sleep-time-option" data-minutes="30">30 мин</button>
        <button class="sleep-time-option" data-minutes="60">60 мин</button>
      </div>
      <div class="sleep-timer-display" id="sleepTimerDisplay"></div>
    </div>
  </div>

  <div class="chat-container" role="region" aria-label="Чат эфира">
    <div class="chat-header">💬 ЧАТ ЭФИРА</div>
    <div class="chat-messages" id="chatMessages" role="log" aria-live="polite" aria-relevant="additions">
      <div class="chat-message">
        <div class="message-nick">Система</div>
        <div class="message-text">Добро пожаловать в эфир! 🔥</div>
      </div>
    </div>
    <div class="chat-input-wrapper">
      <input type="text" id="chatInput" placeholder="Сообщение..." autocomplete="off" aria-label="Введите сообщение" maxlength="500">
      <button onclick="sendMessage()" aria-label="Отправить сообщение">➤</button>
    </div>
    <div class="error-message" id="chatError" role="alert"></div>
  </div>

  <!-- Аквариумные рыбки -->
  <div class="fish" id="fish1" style="top: 20%; left: -50px;">
    <svg viewBox="0 0 40 25" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="18" cy="12.5" rx="12" ry="8" fill="#ff6b6b"/>
      <ellipse cx="28" cy="12.5" rx="8" ry="6" fill="#ff8787"/>
      <polygon points="35,12.5 40,8 40,17" fill="#ff6b6b"/>
      <circle cx="14" cy="10" r="2" fill="#fff"/>
      <circle cx="14" cy="10" r="1" fill="#000"/>
      <path d="M 18 12.5 Q 22 8 28 10" stroke="#ff8787" stroke-width="1" fill="none"/>
    </svg>
  </div>
  <div class="fish" id="fish2" style="top: 70%; left: -50px;">
    <svg viewBox="0 0 40 25" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="18" cy="12.5" rx="12" ry="8" fill="#4ecdc4"/>
      <ellipse cx="28" cy="12.5" rx="8" ry="6" fill="#6ee7df"/>
      <polygon points="35,12.5 40,8 40,17" fill="#4ecdc4"/>
      <circle cx="14" cy="10" r="2" fill="#fff"/>
      <circle cx="14" cy="10" r="1" fill="#000"/>
      <path d="M 18 12.5 Q 22 8 28 10" stroke="#6ee7df" stroke-width="1" fill="none"/>
    </svg>
  </div>
  
  <!-- Лягушка Pepe -->
  <a href="https://t.me/chatradiogram" target="_blank" rel="noopener noreferrer" class="pepe-fish" id="pepeFish" style="top: 50%; left: -60px;" aria-label="Перейти в чат Telegram">
    <svg viewBox="0 0 50 35" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="25" cy="18" rx="18" ry="12" fill="#4CAF50"/>
      <ellipse cx="25" cy="18" rx="14" ry="9" fill="#81C784"/>
      <circle cx="15" cy="10" r="5" fill="#4CAF50"/>
      <circle cx="35" cy="10" r="5" fill="#4CAF50"/>
      <circle cx="15" cy="10" r="3" fill="#fff"/>
      <circle cx="35" cy="10" r="3" fill="#fff"/>
      <circle cx="15" cy="10" r="1.5" fill="#000"/>
      <circle cx="35" cy="10" r="1.5" fill="#000"/>
      <path d="M 18 22 Q 25 28 32 22" stroke="#2E7D32" stroke-width="2" fill="none"/>
      <ellipse cx="10" cy="24" rx="4" ry="3" fill="#4CAF50"/>
      <ellipse cx="40" cy="24" rx="4" ry="3" fill="#4CAF50"/>
    </svg>
  </a>
  <div class="pepe-dialog" id="pepeDialog">переходи в наш чат в телеграм</div>

  <script>
    // === КОНСТАНТЫ ===
    const CONSTANTS = {
      STREAM_URL: 'https://radiogram.su/radio/8000/radio.mp3',
      API_URL: 'https://radiogram.su/api/nowplaying/radio_gram',
      CHAT_API: '/.netlify/functions/send-chat',
      MAX_NICK_LENGTH: 20,
      MIN_NICK_LENGTH: 3,
      MAX_MESSAGE_LENGTH: 500,
      MAX_CHAT_HISTORY: 50,
      RECONNECT_DELAY: 3000,
      UPDATE_INTERVAL: 30000
    };

    // === ФУНКЦИЯ БЕЗОПАСНОСТИ (XSS защита) ===
    function escapeHtml(text) {
      if (typeof text !== 'string') return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // === АУДИО ПЛЕЕР ===
    let audio = null;
    let isPlaying = false;
    let reconnectTimer = null;
    let isBuffering = false;

    const playBtn = document.getElementById('playBtn');
    const statusText = document.getElementById('statusText');

    const pauseIconSVG = `<svg class="pause-icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect x="16" y="14" width="12" height="36" rx="4" />
      <rect x="36" y="14" width="12" height="36" rx="4" />
    </svg>`;
    
    const gramIconSVG = `<svg class="gram-icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M 14 22 L 32 52 L 50 22" />
      <path d="M 14 22 L 50 22" />
      <path d="M 32 22 L 32 37" />
    </svg>`;

    function initAudio() {
      if (!audio) {
        audio = new Audio();
        audio.preload = 'auto';
        audio.crossOrigin = 'anonymous';
        audio.volume = 1.0;
        
        audio.addEventListener('error', handleAudioError);
        audio.addEventListener('waiting', () => {
          isBuffering = true;
          statusText.textContent = '⏳ Буферизация...';
          statusText.className = 'status buffering';
        });
        audio.addEventListener('playing', () => {
          isBuffering = false;
          statusText.textContent = '🔴 СЕЙЧАС ИГРАЕТ';
          statusText.className = 'status success';
        });
        audio.addEventListener('stalled', handleAudioError);
      }
    }

    function handleAudioError() {
      console.error('Ошибка аудио потока');
      statusText.textContent = '⚠️ Потеряно соединение. Переподключение...';
      statusText.className = 'status error';
      
      if (reconnectTimer) clearTimeout(reconnectTimer);
      reconnectTimer = setTimeout(() => {
        if (isPlaying && audio) {
          statusText.textContent = '🔄 Переподключение...';
          statusText.className = 'status buffering';
          audio.src = CONSTANTS.STREAM_URL;
          console.log('Attempting to play:', CONSTANTS.STREAM_URL);
          audio.play().catch(err => {
            console.error('Не удалось переподключиться:', err);
            stopPlayback();
          });
        }
      }, CONSTANTS.RECONNECT_DELAY);
    }

    function stopPlayback() {
      if (audio) {
        audio.pause();
        audio.src = '';
      }
      isPlaying = false;
      isBuffering = false;
      if (reconnectTimer) clearTimeout(reconnectTimer);
      playBtn.innerHTML = gramIconSVG;
      playBtn.classList.remove('playing', 'paused');
      playBtn.classList.add('paused');
      playBtn.setAttribute('aria-pressed', 'false');
      statusText.textContent = '⏸ ПАУЗА';
      statusText.className = 'status';
    }

    async function togglePlayback() {
      initAudio();
      
      if (!isPlaying) {
        try {
          statusText.textContent = '⏳ Подключение...';
          statusText.className = 'status buffering';
          
          audio.src = CONSTANTS.STREAM_URL;
          console.log('Attempting to play:', CONSTANTS.STREAM_URL);
          
          const playPromise = new Promise((resolve, reject) => {
            let hasResolved = false;
            
            const cleanup = () => {
              audio.removeEventListener('playing', onPlaying);
              audio.removeEventListener('error', onError);
              audio.removeEventListener('stalled', onStalled);
            };
            
            const onPlaying = () => {
              if (hasResolved) return;
              hasResolved = true;
              cleanup();
              resolve();
            };
            
            const onError = (e) => {
              if (hasResolved) return;
              hasResolved = true;
              cleanup();
              reject(new Error('Audio stream error'));
            };
            
            const onStalled = () => {
              if (hasResolved) return;
              hasResolved = true;
              cleanup();
              reject(new Error('Stream stalled'));
            };
            
            audio.addEventListener('playing', onPlaying);
            audio.addEventListener('error', onError);
            audio.addEventListener('stalled', onStalled);
            
            audio.play().catch(err => {
              if (!hasResolved) {
                hasResolved = true;
                cleanup();
                reject(err);
              }
            });
          });
          
          await Promise.race([
            playPromise,
            new Promise((_, reject) => setTimeout(() => reject(new Error('Timeout')), 15000))
          ]);
          
          console.log('Play initiated successfully');
          
          playBtn.innerHTML = pauseIconSVG;
          playBtn.classList.remove('paused');
          playBtn.classList.add('playing');
          playBtn.setAttribute('aria-pressed', 'true');
          statusText.textContent = '🔴 СЕЙЧАС ИГРАЕТ';
          statusText.className = 'status success';
          isPlaying = true;
          
        } catch (err) {
          console.error('Ошибка воспроизведения:', err);
          statusText.textContent = '❌ Ошибка подключения';
          statusText.className = 'status error';
          stopPlayback();
        }
      } else {
        stopPlayback();
      }
    }

    playBtn.addEventListener('click', togglePlayback);
    
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && e.target.tagName !== 'INPUT') {
        e.preventDefault();
        togglePlayback();
      }
    });

    window.addEventListener('beforeunload', () => {
      if (reconnectTimer) clearTimeout(reconnectTimer);
      if (audio) {
        audio.pause();
        audio.src = '';
      }
      clearSleepTimer();
      const maxId = window.setTimeout(() => {}, 0);
      for (let i = 1; i <= maxId; i++) {
        clearTimeout(i);
      }
    });

    // === СЧЁТЧИК СЛУШАТЕЛЕЙ ===
    async function updateListenerCount() {
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 5000);
        
        const response = await fetch(CONSTANTS.API_URL, { 
          signal: controller.signal,
          headers: { 'Accept': 'application/json' }
        });
        clearTimeout(timeoutId);
        
        if (!response.ok) throw new Error('HTTP error');
        
        const data = await response.json();
        const listeners = data.listeners?.total || 0;
        
        const countEl = document.getElementById('listenerCount');
        const listenersEl = document.querySelector('.listeners-count');
        
        if (countEl) countEl.textContent = listeners;
        
        if (listeners > 0) {
          if (listenersEl) {
            listenersEl.className = 'listeners-count active';
          }
          if (isPlaying && !isBuffering) {
            statusText.textContent = '🔴 СЕЙЧАС ИГРАЕТ';
            statusText.className = 'status success';
          }
        } else {
          if (listenersEl) {
            listenersEl.className = 'listeners-count offline';
          }
        }
      } catch (error) {
        console.error('Ошибка статистики:', error.message);
      }
    }

    updateListenerCount();
    const statsInterval = setInterval(updateListenerCount, CONSTANTS.UPDATE_INTERVAL);

    // === ЭМОДЗИ АНИМАЦИЯ ===
    const emojis = ['😊', '❤️', '👍', '', '✨', '', '💯', '🌟', '💪'];
    let emojiTimer = null;
    
    function showRandomEmoji() {
      const emoji = document.createElement('div');
      emoji.className = 'emoji';
      emoji.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      
      const x = Math.random() * (window.innerWidth - 50);
      const y = Math.random() * (window.innerHeight - 50);
      
      emoji.style.left = x + 'px';
      emoji.style.top = y + 'px';
      
      document.body.appendChild(emoji);
      
      setTimeout(() => {
        emoji.remove();
      }, 4000);
      
      scheduleNextEmoji();
    }
    
    function scheduleNextEmoji() {
      if (emojiTimer) clearTimeout(emojiTimer);
      const delay = Math.random() * 2000 + 5000;
      emojiTimer = setTimeout(showRandomEmoji, delay);
    }
    
    emojiTimer = setTimeout(scheduleNextEmoji, 5000);

    // === ТАЙМЕР СНА ===
    let sleepTimer = null;
    let sleepTimeRemaining = 0;
    let sleepInterval = null;
    
    const sleepTimerBtn = document.getElementById('sleepTimerBtn');
    const sleepTimerOptions = document.getElementById('sleepTimerOptions');
    const sleepTimerDisplay = document.getElementById('sleepTimerDisplay');
    const sleepTimeOptions = document.querySelectorAll('.sleep-time-option');
    
    sleepTimerBtn.addEventListener('click', () => {
      sleepTimerOptions.classList.toggle('show');
      sleepTimerBtn.classList.toggle('active');
    });
    
    sleepTimeOptions.forEach(option => {
      option.addEventListener('click', () => {
        const minutes = parseInt(option.dataset.minutes);
        setSleepTimer(minutes);
        
        sleepTimeOptions.forEach(opt => opt.classList.remove('selected'));
        option.classList.add('selected');
        
        sleepTimerOptions.classList.remove('show');
      });
    });
    
    function setSleepTimer(minutes) {
      clearSleepTimer();
      
      sleepTimeRemaining = minutes * 60 * 1000;
      const endTime = Date.now() + sleepTimeRemaining;
      
      updateSleepTimerDisplay(sleepTimeRemaining);
      
      sleepInterval = setInterval(() => {
        sleepTimeRemaining = endTime - Date.now();
        
        if (sleepTimeRemaining <= 0) {
          clearInterval(sleepInterval);
          stopPlayback();
          sleepTimerDisplay.textContent = '💤 Таймер выключил радио';
          sleepTimerBtn.classList.remove('active');
          sleepTimeOptions.forEach(opt => opt.classList.remove('selected'));
          
          setTimeout(() => {
            sleepTimerDisplay.textContent = '';
          }, 5000);
        } else {
          updateSleepTimerDisplay(sleepTimeRemaining);
        }
      }, 1000);
    }
    
    function updateSleepTimerDisplay(ms) {
      const totalSeconds = Math.floor(ms / 1000);
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;
      
      let display = '⏳ Осталось: ';
      if (hours > 0) {
        display += `${hours}ч `;
      }
      display += `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
      
      sleepTimerDisplay.textContent = display;
    }
    
    function clearSleepTimer() {
      if (sleepInterval) {
        clearInterval(sleepInterval);
        sleepInterval = null;
      }
      sleepTimeRemaining = 0;
    }
    
    // === ЧАТ ===
    function getCurrentNick() {
      return 'Аноним';
    }

    const chatInput = document.getElementById('chatInput');
    const chatMessages = document.getElementById('chatMessages');
    const chatError = document.getElementById('chatError');
    let chatHistory = [];

    function loadChatHistory() {
      const saved = localStorage.getItem('radioGramChatHistory');
      if (saved) {
        try {
          chatHistory = JSON.parse(saved);
          chatHistory.slice(-CONSTANTS.MAX_CHAT_HISTORY).forEach(msg => {
            renderMessage(msg.nick, msg.text, msg.time, false);
          });
        } catch (e) {
          console.error('Ошибка загрузки истории чата:', e);
        }
      }
    }

    function saveChatHistory() {
      localStorage.setItem('radioGramChatHistory', JSON.stringify(chatHistory));
    }

    function showChatError(message) {
      chatError.textContent = message;
      chatError.classList.add('visible');
      setTimeout(() => chatError.classList.remove('visible'), 3000);
    }

    function renderMessage(nick, text, time, scroll = true) {
      const div = document.createElement('div');
      div.className = 'chat-message';
      
      const safeNick = escapeHtml(nick);
      const safeText = escapeHtml(text);
      
      div.innerHTML = `
        <div class="message-nick">${safeNick}</div>
        <div class="message-text">${safeText}</div>
      `;
      chatMessages.appendChild(div);
      
      const messages = chatMessages.querySelectorAll('.chat-message');
      if (messages.length > CONSTANTS.MAX_CHAT_HISTORY) {
        messages[0].remove();
      }
      
      if (scroll) {
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }
    }

    function addMessageToHistory(nick, text) {
      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      chatHistory.push({ nick, text, time });
      
      if (chatHistory.length > CONSTANTS.MAX_CHAT_HISTORY) {
        chatHistory.shift();
      }
      
      saveChatHistory();
      return time;
    }
    
    function addSystemMessage(text) {
      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      chatHistory.push({ nick: 'Система', text: text, time: time, isSystem: true });
      
      if (chatHistory.length > CONSTANTS.MAX_CHAT_HISTORY) {
        chatHistory.shift();
      }
      
      saveChatHistory();
      
      const messageDiv = document.createElement('div');
      messageDiv.className = 'chat-message system-message';
      messageDiv.style.borderLeftColor = '#4a9bc9';
      messageDiv.style.background = '#1a1a25';
      messageDiv.innerHTML = `
        <div class="message-nick" style="color: #4a9bc9;">Система</div>
        <div class="message-text">${escapeHtml(text)}</div>
      `;
      chatMessages.appendChild(messageDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    async function sendMessage() {
      const text = chatInput.value.trim();
      if (!text) return;

      if (text.length > CONSTANTS.MAX_MESSAGE_LENGTH) {
        showChatError(`Сообщение слишком длинное (макс. ${CONSTANTS.MAX_MESSAGE_LENGTH})`);
        return;
      }

      const nick = getCurrentNick();
      const time = addMessageToHistory(nick, text);
      renderMessage(nick, text, time);
      sendToTelegram(text);
      chatInput.value = '';

      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 5000);
        
        await fetch(CONSTANTS.CHAT_API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nick: nick, text: text }),
          signal: controller.signal
        });
        clearTimeout(timeoutId);
      } catch (err) {
        console.log('Чат работает локально:', err.message);
      }
    }

    const displayedMessageIds = new Set();

    async function getMessagesFromTelegram() {
      try {
        const response = await fetch('https://radiogram-backend-production.up.railway.app/api/get-from-telegram');
        const data = await response.json();
        
        if (data.messages && data.messages.length > 0) {
          for (const msg of data.messages) {
            if (!displayedMessageIds.has(msg.id)) {
              const time = addMessageToHistory(msg.user, msg.message);
              renderMessage(msg.user, msg.message, time);
              displayedMessageIds.add(msg.id);
            }
          }
        }
      } catch (error) {
        console.error('Failed to get messages from Telegram:', error);
      }
    }

    setInterval(getMessagesFromTelegram, 3000);
    setTimeout(getMessagesFromTelegram, 1000);

    chatInput.addEventListener('keypress', e => {
      if (e.key === 'Enter') sendMessage();
    });

    loadChatHistory();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(registration => {
            console.log('Service Worker зарегистрирован:', registration.scope);
          })
          .catch(error => {
            console.log('Ошибка регистрации Service Worker:', error);
          });
      });
    }

    // === АКВАРИУМНЫЕ РЫБКИ ===
    const fish1 = document.getElementById('fish1');
    const fish2 = document.getElementById('fish2');
    const pepeFish = document.getElementById('pepeFish');
    const pepeDialog = document.getElementById('pepeDialog');

    function createBubble(x, y) {
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      const size = Math.random() * 8 + 4;
      bubble.style.width = size + 'px';
      bubble.style.height = size + 'px';
      bubble.style.left = x + 'px';
      bubble.style.top = y + 'px';
      bubble.style.animationDuration = (Math.random() * 2 + 2) + 's';
      document.body.appendChild(bubble);
      
      setTimeout(() => bubble.remove(), 4000);
    }

    function updatePepeDialog() {
      if (!pepeFish || !pepeDialog) return;
      
      const pepeRect = pepeFish.getBoundingClientRect();
      const dialogWidth = pepeDialog.offsetWidth;
      const dialogHeight = pepeDialog.offsetHeight;
      
      const dialogX = pepeRect.left + (pepeRect.width / 2) - (dialogWidth / 2);
      const dialogY = pepeRect.top - dialogHeight - 10;
      
      pepeDialog.style.left = dialogX + 'px';
      pepeDialog.style.top = dialogY + 'px';
    }

    function showPepeDialog() {
      if (!pepeDialog) return;
      updatePepeDialog();
      pepeDialog.classList.add('visible');
      
      setTimeout(() => {
        pepeDialog.classList.remove('visible');
      }, 3000);
    }

    function initFish() {
      const fishes = [fish1, fish2];

      fishes.forEach((fish, index) => {
        let x = Math.random() * window.innerWidth;
        let y = Math.random() * (window.innerHeight - 200) + 100;
        let baseSpeed = Math.random() * 0.5 + 0.3;
        let speedX = baseSpeed * (Math.random() > 0.5 ? 1 : -1);
        let speedY = baseSpeed * 0.2 * (Math.random() > 0.5 ? 1 : -1);
        let direction = speedX > 0 ? 'right' : 'left';
        let isAccelerating = false;
        let lastBubbleTime = Date.now();

        fish.style.left = x + 'px';
        fish.style.top = y + 'px';

        function swim() {
          if (!isAccelerating) {
            speedY *= 0.98;
            if (Math.abs(speedY) < 0.05) speedY = 0;
          }

          x += speedX;
          y += speedY;

          if (!isAccelerating && y < window.innerHeight / 2) {
            speedY += 0.01;
          } else if (!isAccelerating && y > window.innerHeight / 2) {
            speedY -= 0.01;
          }

          if (x <= -60) {
            x = -60;
            speedX = Math.abs(speedX);
            direction = 'right';
          } else if (x >= window.innerWidth - 20) {
            x = window.innerWidth - 20;
            speedX = -Math.abs(speedX);
            direction = 'left';
          }

          if (y <= 60) {
            y = 60;
            speedY = Math.abs(speedY) * 0.5;
          } else if (y >= window.innerHeight - 60) {
            y = window.innerHeight - 60;
            speedY = -Math.abs(speedY) * 0.5;
          }

          if (direction === 'left') {
            fish.classList.add('swimming-left');
          } else {
            fish.classList.remove('swimming-left');
          }

          fish.style.left = x + 'px';
          fish.style.top = y + 'px';

          if (!isAccelerating && Date.now() - lastBubbleTime > Math.random() * 3000 + 2000) {
            createBubble(x + 20, y + 10);
            lastBubbleTime = Date.now();
          }

          requestAnimationFrame(swim);
        }

        swim();

        fish.addEventListener('click', (e) => {
          e.stopPropagation();
          isAccelerating = true;

          const boost = 3 + Math.random() * 2;
          speedX = -speedX * boost;
          speedY = (Math.random() - 0.5) * 4;

          setTimeout(() => {
            isAccelerating = false;
            baseSpeed = Math.random() * 0.5 + 0.3;
            speedX = speedX > 0 ? baseSpeed : -baseSpeed;
            speedY = baseSpeed * 0.2 * (Math.random() > 0.5 ? 1 : -1);
          }, 2000);
        });
      });

      let pepeX = Math.random() * window.innerWidth;
      let pepeY = Math.random() * (window.innerHeight - 200) + 100;
      let pepeBaseSpeed = 0.4;
      let pepeSpeedX = pepeBaseSpeed * (Math.random() > 0.5 ? 1 : -1);
      let pepeSpeedY = pepeBaseSpeed * 0.15 * (Math.random() > 0.5 ? 1 : -1);
      let pepeDirection = pepeSpeedX > 0 ? 'right' : 'left';

      pepeFish.style.left = pepeX + 'px';
      pepeFish.style.top = pepeY + 'px';

      function swimPepe() {
        pepeSpeedY *= 0.99;
        if (Math.abs(pepeSpeedY) < 0.03) pepeSpeedY = 0;

        pepeX += pepeSpeedX;
        pepeY += pepeSpeedY;

        if (pepeY < window.innerHeight / 2) {
          pepeSpeedY += 0.005;
        } else if (pepeY > window.innerHeight / 2) {
          pepeSpeedY -= 0.005;
        }

        if (pepeX <= -70) {
          pepeX = -70;
          pepeSpeedX = Math.abs(pepeSpeedX);
          pepeDirection = 'right';
        } else if (pepeX >= window.innerWidth - 30) {
          pepeX = window.innerWidth - 30;
          pepeSpeedX = -Math.abs(pepeSpeedX);
          pepeDirection = 'left';
        }

        if (pepeY <= 50) {
          pepeY = 50;
          pepeSpeedY = Math.abs(pepeSpeedY) * 0.3;
        } else if (pepeY >= window.innerHeight - 50) {
          pepeY = window.innerHeight - 50;
          pepeSpeedY = -Math.abs(pepeSpeedY) * 0.3;
        }

        if (pepeDirection === 'left') {
          pepeFish.classList.add('swimming-left');
        } else {
          pepeFish.classList.remove('swimming-left');
        }

        pepeFish.style.left = pepeX + 'px';
        pepeFish.style.top = pepeY + 'px';

        if (Math.random() < 0.003) {
          createBubble(pepeX + 25, pepeY + 15);
        }

        // Показываем диалог периодически
        if (Math.random() < 0.001) {
          showPepeDialog();
        }

        requestAnimationFrame(swimPepe);
      }

      swimPepe();
    }

    setTimeout(initFish, 1000);

    // === ФУНКЦИЯ ОТПРАВКИ В TELEGRAM ===
    async function sendToTelegram(message) {
      try {
        await fetch('https://radiogram-backend-production.up.railway.app/api/send-to-telegram', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: message })
        });
        console.log('Message sent to Telegram');
      } catch (error) {
        console.error('Telegram error:', error);
      }
    }

    // === ЕЖЕЧАСНОЕ ОБЪЯВЛЕНИЕ ВРЕМЕНИ ===
    function announceTime() {
      const now = new Date();
      const hours = now.getHours();
      const minutes = now.getMinutes();
      
      if (minutes !== 0) return;

      const timeString = `${hours}:${minutes < 10 ? '0' : ''}${minutes}`;
      const message = `Сейчас московское время: ${hours} часов ${minutes === 0 ? '' : minutes + ' минут'}`;
      
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        
        const utterance = new SpeechSynthesisUtterance(message);
        utterance.lang = 'ru-RU';
        utterance.rate = 0.9;
        utterance.pitch = 1.2;
        utterance.volume = 0.8;
        
        const voices = window.speechSynthesis.getVoices();
        const femaleVoice = voices.find(voice => 
          voice.name.includes('Female') || 
          voice.name.includes('Irina') || 
          voice.name.includes('Milena') ||
          voice.name.includes('Tatyana') ||
          voice.lang === 'ru-RU' && voice.name.toLowerCase().includes('female')
        );
        
        if (femaleVoice) {
          utterance.voice = femaleVoice;
        }
        
        window.speechSynthesis.speak(utterance);
        console.log('Объявление времени:', message);
      }
    }

    setInterval(announceTime, 60000);
    setTimeout(announceTime, 2000);

    // === ДИНАМИЧЕСКИЙ ФОН ПОБЕРЕЖЬЯ ===
    // Массивы изображений для каждого времени суток (меняются каждый час)
    const beachImages = {
      sunrise: [
        'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1920&q=80',
        'https://images.unsplash.com/photo-1590523741831-ab7f41199401?auto=format&fit=crop&w=1920&q=80',
        'https://images.unsplash.com/photo-1505118380757-91f5f5636de0?auto=format&fit=crop&w=1920&q=80',
        'https://images.unsplash.com/photo-1544983058-293e26f4b9d6?auto=format&fit=crop&w=1920&q=80'
      ],
      day: [
        'https://images.unsplash.com/photo-1506929562872-bb421503ef21?auto=format&fit=crop&w=1920&q=80',
        'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1920&q=80',
        'https://images.unsplash.com/photo-1520250497591-112f2f40a3f4?auto=format&fit=crop&w=1920&q=80',
        'https://images.unsplash.com/photo-1473496169904-658ba7c44d8a?auto=format&fit=crop&w=1920&q=80'
      ],
      evening: [
        'https://images.unsplash.com/photo-1473116763249-56464eb6f81e?auto=format&fit=crop&w=1920&q=80',
        'https://images.unsplash.com/photo-1473116763249-56464eb6f81e?auto=format&fit=crop&w=1920&q=80',
        'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1920&q=80',
        'https://images.unsplash.com/photo-1505118380757-91f5f5636de0?auto=format&fit=crop&w=1920&q=80'
      ],
      night: [
        'https://images.unsplash.com/photo-1519046904884-53103b34b206?auto=format&fit=crop&w=1920&q=80',
        'https://images.unsplash.com/photo-1505118380757-91f5f5636de0?auto=format&fit=crop&w=1920&q=80',
        'https://images.unsplash.com/photo-1544983058-293e26f4b9d6?auto=format&fit=crop&w=1920&q=80',
        'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1920&q=80'
      ]
    };

    let lastHour = -1;
    let lastImageIndex = -1;

    function updateOceanBackground() {
      const nowLocal = new Date();
      const hours = nowLocal.getHours();
      const currentHour = hours;
      
      const backgroundElement = document.getElementById('oceanBackground');
      console.log('updateOceanBackground вызван, час:', currentHour, 'элемент найден:', !!backgroundElement);
      if (!backgroundElement) return;
      
      let timeClass = 'night';
      let imageArray = beachImages.night;
      
      // Определяем время суток и массив изображений
      if (hours >= 5 && hours < 12) {
        timeClass = 'sunrise';
        imageArray = beachImages.sunrise;
      } else if (hours >= 12 && hours < 17) {
        timeClass = 'day';
        imageArray = beachImages.day;
      } else if (hours >= 17 && hours < 22) {
        timeClass = 'evening';
        imageArray = beachImages.evening;
      } else {
        timeClass = 'night';
        imageArray = beachImages.night;
      }
      
      // Меняем изображение только если наступил новый час или это первый запуск
      if (currentHour !== lastHour || lastImageIndex === -1) {
        // Выбираем случайное изображение из массива, отличное от предыдущего
        let newIndex;
        do {
          newIndex = Math.floor(Math.random() * imageArray.length);
        } while (newIndex === lastImageIndex && imageArray.length > 1);
        
        lastImageIndex = newIndex;
        const imageUrl = imageArray[newIndex];
        
        // Предзагрузка изображения перед установкой фона
        const img = new Image();
        img.onload = function() {
          console.log('Изображение загружено:', imageUrl);
          // Добавляем класс для плавного появления
          backgroundElement.classList.remove('fade-in');
          void backgroundElement.offsetWidth; // Триггер reflow для перезапуска анимации
          backgroundElement.classList.add('fade-in');
          
          backgroundElement.className = `ocean-background ${timeClass} fade-in`;
          backgroundElement.style.backgroundImage = `url('${imageUrl}')`;
          backgroundElement.style.setProperty('background-image', `url('${imageUrl}')`, 'important');
          
          lastHour = currentHour;
          console.log(`Фон обновлен: ${timeClass}, час: ${currentHour}, URL: ${imageUrl}`);
        };
        img.onerror = function() {
          console.error('Ошибка загрузки изображения:', imageUrl);
          // Пробуем запасное изображение в случае ошибки
          if (imageArray.length > 1) {
            const fallbackIndex = (newIndex + 1) % imageArray.length;
            const fallbackUrl = imageArray[fallbackIndex];
            const fallbackImg = new Image();
            fallbackImg.onload = function() {
              backgroundElement.classList.remove('fade-in');
              void backgroundElement.offsetWidth;
              backgroundElement.classList.add('fade-in');
              backgroundElement.className = `ocean-background ${timeClass} fade-in`;
              backgroundElement.style.backgroundImage = `url('${fallbackUrl}')`;
              backgroundElement.style.setProperty('background-image', `url('${fallbackUrl}')`, 'important');
              lastHour = currentHour;
              console.log(`Фон обновлен (запасной): ${timeClass}, час: ${currentHour}, URL: ${fallbackUrl}`);
            };
            fallbackImg.src = fallbackUrl;
          }
        };
        img.src = imageUrl;
      }
    }

    updateOceanBackground();
    // Проверяем каждый час (3600000 мс), но также можно чаще для тестирования
    setInterval(updateOceanBackground, 3600000);

    // Счетчик уникальных пользователей за сутки
    function updateUniqueUsersCounter() {
      const counterElement = document.getElementById('uniqueUsersCount');
      if (!counterElement) return;
      
      // Получаем текущую дату как ключ для localStorage
      const today = new Date().toDateString();
      const storedDate = localStorage.getItem('uniqueUsersDate');
      let uniqueCount = parseInt(localStorage.getItem('uniqueUsersCount') || '0');
      
      // Если наступил новый день, сбрасываем счетчик
      if (storedDate !== today) {
        uniqueCount = Math.floor(Math.random() * 500) + 100; // Имитация: 100-600 пользователей
        localStorage.setItem('uniqueUsersDate', today);
        localStorage.setItem('uniqueUsersCount', uniqueCount.toString());
      } else {
        // Периодически увеличиваем счетчик в течение дня
        const lastUpdate = parseInt(localStorage.getItem('uniqueUsersLastUpdate') || '0');
        const now = Date.now();
        if (now - lastUpdate > 300000) { // Каждые 5 минут
          const increment = Math.floor(Math.random() * 10) + 1;
          uniqueCount += increment;
          localStorage.setItem('uniqueUsersCount', uniqueCount.toString());
          localStorage.setItem('uniqueUsersLastUpdate', now.toString());
        }
      }
      
      counterElement.textContent = uniqueCount;
    }
    
    // Обновляем счетчик при загрузке и каждые 5 минут
    updateUniqueUsersCounter();
    setInterval(updateUniqueUsersCounter, 300000);

  </script>
</body>
